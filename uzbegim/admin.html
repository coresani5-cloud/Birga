<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="staff.css">
<style>
.tabsbar{display:flex;gap:6px;flex-wrap:wrap}
.tabsbar button{height:40px;padding:0 16px;border-radius:12px;font-weight:800;background:var(--glass);border:1px solid var(--ln)}
.tabsbar button.on{background:var(--grad);color:#120d09;border-color:transparent}
.top2{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 14px;padding:10px max(16px,env(safe-area-inset-left,0px));background:rgba(15,12,10,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.top2 .brand{font-size:17px}
.tools{display:flex;gap:8px;align-items:center}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--ln)}
.ib svg{width:20px;height:20px}.ib.off{color:var(--mut)}
.tabsbar{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tabsbar::-webkit-scrollbar{display:none}
.tabsbar button{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.tabsbar button.on .badge{background:#120d09;color:#fff}
@media (min-width:901px){.top2{grid-template-columns:auto 1fr auto}.tabsbar{grid-column:2;grid-row:1}}
.btool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn.sm{height:40px;padding:0 14px;font-size:13px}.btn.sm svg{width:18px;height:18px}
.btn.ghost.on{border-color:var(--or);color:var(--or2)}
.stabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;position:sticky;top:118px;z-index:10;padding:6px 0;background:var(--bg)}
.stabs:empty{display:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;height:40px;padding:0 12px;border-radius:12px;background:var(--glass);border:1px solid var(--ln);font-weight:800;font-size:13px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.stabs button span{min-width:22px;height:22px;border-radius:99px;background:var(--glass2);display:grid;place-items:center;font-size:12px}
.stabs button.on{background:var(--grad);color:#120d09;border-color:transparent}
.stabs button.on span{background:rgba(0,0,0,.18)}
.stabs button.hot:not(.on){border-color:var(--or)}.stabs button.hot span{background:var(--red);color:#fff}
.board.mob{display:block}.board.mob .col{gap:12px}
.where{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--ln)}
.where b{color:var(--mut);font-weight:700}
.where.warn{border-color:rgba(255,122,0,.45);background:rgba(255,122,0,.1)}
.where.on{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.where.bad{border-color:rgba(255,90,78,.4);background:rgba(255,90,78,.08)}
.items2{display:grid;gap:6px;border-top:1px dashed var(--ln);padding-top:8px}
.it{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center}
.it img,.it .noimg{width:44px;height:44px;border-radius:10px;object-fit:contain;background:rgba(255,255,255,.05)}
.it .m{min-width:0}.it b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--mut);font-size:12px}
.it .q{color:var(--or2);font-weight:800;font-size:13px}.it .pr{font-variant-numeric:tabular-nums;font-size:13px;min-width:62px;text-align:right}
.items2 .sum{border-top:1px dashed var(--ln);padding-top:6px;font-size:13px;color:var(--mut);display:grid;gap:2px}
.items2 .sum>div{display:flex;justify-content:space-between}.items2 .sum .tot{color:var(--ink);font-weight:800;font-size:15px}
.acts2{display:grid;gap:8px}
.pill .bi,.stabs .bi,.col h3 .bi,.where .bi{width:16px;height:16px;stroke-width:2.2}
.bi{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.acts2 .big2 .bi{width:22px;height:22px}
.acts2 .big2{height:52px;font-size:16px;width:100%}
.acts2 .sec{display:flex;gap:8px}.acts2 .sec .btn{flex:1;height:42px;font-size:13px}
#ovMapW[hidden]{display:none}
#print{display:none}
@media print{body::before{display:none!important}body{background:#fff!important}
  @page{margin:6mm}
  body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;font:13px/1.35 Manrope,Arial,sans-serif}
  .rc{width:76mm;margin:0 auto}
  .rc-h{display:flex;gap:10px;align-items:center;justify-content:center;padding-bottom:8px;border-bottom:2px dashed #000}
  .rc-h img{width:44px;height:44px}.rc-h b{display:block;font-size:20px;letter-spacing:.12em}.rc-h small{font-size:12px}
  .rc-no{text-align:center;font-size:30px;font-weight:900;margin:8px 0}
  .rc-meta .r,.rc-sum .r{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
  .rc-meta .r span:first-child{color:#555}
  .rc-note{margin:6px 0;padding:6px;border:1px solid #000;border-radius:6px;font-weight:700}
  .rc-items{border-top:2px dashed #000;border-bottom:2px dashed #000;margin:8px 0;padding:6px 0;display:grid;gap:6px}
  .ri{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;break-inside:avoid}
  .ri img,.ri .noimg{width:42px;height:42px;object-fit:contain}
  .ri b{display:block;font-size:13px}.ri small{display:block;font-size:11px;color:#444}.ri .s{font-weight:800}
  .rc-sum .tot{font-size:17px;font-weight:900;border-top:1px solid #000;margin-top:4px;padding-top:4px}
  .rc-f{text-align:center;margin-top:10px;font-size:11px;color:#333}
}
.board{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col>h3{font-size:14px;display:flex;justify-content:flex-start;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--ln)}
.col>h3 .n{margin-left:auto;font-family:Manrope;font-size:12px;min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:var(--glass2)}
.col.c-new>h3{border-color:rgba(255,122,0,.5)}
.col.c-new>h3 .n{background:var(--grad);color:#120d09}
.empty{padding:20px 10px;text-align:center;color:var(--mut);font-size:13px;border:1px dashed var(--ln);border-radius:16px}
#ovMap{height:300px;border-radius:20px;overflow:hidden;margin-bottom:14px;border:1px solid var(--ln)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.cour{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cform{display:grid;gap:6px;width:100%}
.cform input,.cform select,.fld{height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--glass);padding:0 10px;outline:none;font-size:13px;color:var(--ink)}
.cform select option,.fld option{background:#17120e}
.stars{color:#d9b35b;letter-spacing:1px}
.view[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--ln)}
.kpi span{display:block;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:Unbounded;font-size:24px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.board{grid-template-columns:repeat(5,85vw);scroll-snap-type:x mandatory}.col{scroll-snap-align:start}.grid2{grid-template-columns:1fr}}
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--ln)}
.mi img{width:46px;height:46px;object-fit:contain}
.mi .t{flex:1;min-width:0;font-size:13px;font-weight:700}
.mi.off{border-color:rgba(255,90,78,.45);background:rgba(255,90,78,.08)}
.sw{width:46px;height:26px;border-radius:99px;background:var(--ok);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:23px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.mi.off .sw{background:#555}.mi.off .sw::after{left:3px}

.alarm{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:16px;background:#2a1609;border:1px solid var(--or);box-shadow:0 10px 30px rgba(0,0,0,.5);font-weight:800;font-size:14px;max-width:calc(100% - 24px);cursor:pointer}
.alarm[hidden]{display:none}
.warnbar{margin-bottom:12px;padding:12px 14px;border-radius:14px;background:rgba(255,90,78,.12);border:1px solid rgba(255,90,78,.45);color:#ffb4ad;font-size:13px;font-weight:700}
.pausebar{margin-bottom:12px;padding:12px 14px;border-radius:14px;background:rgba(255,166,43,.12);border:1px solid rgba(255,166,43,.5);font-size:14px;font-weight:800;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pausebar .btn{height:36px;padding:0 14px;font-size:13px}
.card.late{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,90,78,.18)}
.lt{color:var(--red);font-weight:800}
.pill.nc{background:rgba(31,182,193,.14);color:#6fe3ea;border-color:rgba(31,182,193,.45);justify-self:start;white-space:normal}
.mtool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.mtool .fld{flex:1;min-width:180px}
.mcats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.mcats::-webkit-scrollbar{display:none}
.mcats button{flex:none;height:34px;padding:0 12px;border-radius:10px;background:var(--glass);border:1px solid var(--ln);font-weight:800;font-size:12px}
.mcats button.on{background:var(--grad);color:#120d09;border-color:transparent}
.mlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr))}
.dlg .fld,.zrow .fld,.vrow .fld{min-width:0;width:100%}.zrow>*,.vrow>*,.dlg .grid2>*{min-width:0}
.dlg .row h2{min-width:0;overflow-wrap:anywhere}
.mrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--ln)}
.mrow img,.mrow .ph{width:52px;height:52px;border-radius:12px;object-fit:contain;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:24px}
.mrow .t{min-width:0}.mrow .t b{display:block;font-size:14px}.mrow .t small{color:var(--mut);font-size:12px}
.mrow .pr{font-variant-numeric:tabular-nums;color:var(--or2);font-weight:800;font-size:13px}
.mrow.hid{opacity:.55}.mrow.stop{border-color:rgba(255,90,78,.45)}
.mrow .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.mrow .ac .btn{height:36px;padding:0 12px;font-size:12px}
@media (max-width:640px){.mrow{grid-template-columns:44px 1fr}.mrow img,.mrow .ph{width:44px;height:44px}.mrow .ac{grid-column:1/-1}.mrow .ac .btn{flex:1}}
.dlg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.65);display:grid;grid-template-columns:minmax(0,660px);justify-content:center;align-items:center;padding:12px;overflow:auto}
.dlg[hidden]{display:none}
.dlg form{width:100%;min-width:0;max-height:calc(100vh - 24px);overflow:auto;padding:18px;display:grid;gap:10px;background:var(--bg2);border:1px solid var(--ln);border-radius:20px}
.vrow{display:grid;grid-template-columns:1fr 1fr 120px 36px;gap:6px;align-items:center}
.vrow .x{width:36px;height:36px;border-radius:10px;background:rgba(255,90,78,.15);color:var(--red);font-weight:800}
@media (max-width:560px){.vrow{grid-template-columns:1fr 1fr}.vrow .x{width:100%}}
.imgbox{display:flex;gap:12px;align-items:center}
.imgbox img,.imgbox .ph{width:96px;height:96px;flex:none;border-radius:14px;object-fit:contain;background:rgba(255,255,255,.06);display:grid;place-items:center;font-size:40px}
.lbl2{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.sets>.glass{padding:18px;display:grid;gap:10px}
.sets h2{font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.zrow{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px}
.tg input{width:22px;height:22px;flex:none;accent-color:#ff7a00}
.kbd{font-family:ui-monospace,monospace;font-size:12px;background:var(--glass2);padding:2px 6px;border-radius:6px}
.newpw{font-family:Unbounded;font-size:26px;letter-spacing:.12em;color:var(--or2)}
</style>
</head>
<body>
<div class="flag"></div>
<div id="app"></div>
<div id="print"></div>
<div class="dlg" id="dlg" hidden></div>
<div class="alarm" id="alarm" hidden>🔔 Yangi buyurtma ovozi o'chiq — yoqish uchun ekranning istalgan joyiga bir marta bosing</div>
<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
const U = UZB;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LOGO = '<img src="logo.svg" alt="" style="width:40px;height:40px;border-radius:50%">';
const ss = { get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : (localStorage.removeItem(k), sessionStorage.removeItem(k)); } catch (e) {} } };
let TOK = ss.get('uzb_staff'), ME = null, ORD = {}, BR = [], STOP = new Set(), STAFF = [], es = null, map = null, mk = {}, sound = ss.get('uzb_snd') !== '0', fresh = new Set(), branchF = ss.get('uzb_brf'), view = ss.get('uzb_view') || 'board', colSel = ss.get('uzb_col') || 'c-new', CATI = {}, BASEP = [], MENUCFG = { edits: {}, extra: [] }, OPSD = null;
let tt; function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2800); }
const api = (p, o = {}) => U.api(p, { ...o, headers: { Authorization: 'Bearer ' + TOK } });
const ERR = { locked: 'Ko\'p noto\'g\'ri urinish. 10–15 daqiqadan keyin qayta urinib ko\'ring', forbidden: 'Bu amalga ruxsat yo\'q', closed_order: 'Buyurtma allaqachon yopilgan', exists: 'Bu telefon bilan xodim bor', pin: 'PIN kamida 6 ta raqamdan iborat bo\'lsin', name_phone: 'Ism va telefonni to\'liq yozing', auth: 'Qayta kiring', slow: 'Ko\'p urinish, bir daqiqa kuting' };
const errMsg = x => ERR[x.message] || (x.status ? 'Xato: ' + x.message : 'Server bilan aloqa yo\'q');

// Shu qurilma sozlamalari (planshet/kompyuter)
const dev = (() => { const d = { rep: true, wake: true, print: false }; try { return { ...d, ...JSON.parse(localStorage.getItem('uzb_dev') || '{}') }; } catch (e) { return d; } })();
const devSave = () => { try { localStorage.setItem('uzb_dev', JSON.stringify(dev)); } catch (e) {} };
// Brauzerlar ovozni foydalanuvchi ekranga bosmaguncha bloklaydi (sahifa yangilangandan keyin ham).
// Shuning uchun bitta ovoz konteksti va bosilganda uni "uyg'otish"; bloklangan bo'lsa pastda ogohlantirish chiqadi.
let AC = null;
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); AC.onstatechange = alarmUi; } catch (e) {} } return AC; }
function unlockAudio() { const a = actx(); if (a && a.state !== 'running') a.resume().then(alarmUi, alarmUi); else alarmUi(); }
['pointerdown', 'keydown', 'touchend'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
function alarmUi() { const el = $('#alarm'); if (el) el.hidden = !(sound && ME && (!AC || AC.state !== 'running')); }
function beep() {
  if (!sound) return;
  try {
    const a = actx(); if (!a) return;
    if (a.state !== 'running') { a.resume().catch(() => {}); alarmUi(); }
    [0, .18, .36].forEach((d, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = [880, 1175, 1568][i]; g.gain.setValueAtTime(.2, a.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d + .16); o.connect(g).connect(a.destination); o.start(a.currentTime + d); o.stop(a.currentTime + d + .17); });
  } catch (e) {}
}

function loginView(msg = '') {
  $('#app').innerHTML = `<form class="login glass" id="lf">
    <div class="brand">${LOGO}<div>Uzbegim<small>Oshxona paneli</small></div></div>
    <p class="hint">Xodim telefoni va PIN kodi bilan kiring. Bosh admin faqat PIN kiritadi.</p>
    <input id="ph" type="tel" placeholder="Telefon (bosh admin uchun bo'sh qoldiring)" autocomplete="username">
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN kod" autocomplete="current-password">
    <div class="err">${esc(msg)}</div>
    <button class="btn big">Kirish</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await U.api('staff/login', { body: { phone: $('#ph').value, pin: $('#pin').value.trim() } });
      if (r.staff.role !== 'admin') return loginView('Bu kuryer akkaunti. Kuryerlar courier.html sahifasidan kiradi.');
      TOK = r.token; ss.set('uzb_staff', TOK); ME = r.staff; unlockAudio(); start();
    } catch (x) { loginView(x.status === 401 ? 'Telefon yoki PIN noto\'g\'ri' : errMsg(x)); }
  };
}

// Tugma belgilari (A variant: chiziqli)
const BI = {
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  run: '<circle cx="14" cy="4.5" r="1.8"/><path d="M9 20l2.5-5.5L14 16v4M8 11l3-3 3.5 2.5 2.5 2M11.5 14.5L13 9"/>',
  ok: '<path d="M5 12.5l4.2 4.2L19 7"/>',
  no: '<path d="M6 6l12 12M18 6L6 18"/>',
  chef: '<path d="M7 14.5V19h10v-4.5"/><path d="M7 14.5a4 4 0 0 1-.5-7.9A4.5 4.5 0 0 1 12 4a4.5 4.5 0 0 1 5.5 2.6 4 4 0 0 1-.5 7.9z"/><path d="M7 16.5h10"/>',
  box: '<path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/>',
  bag: '<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/>',
  moto: '<circle cx="6" cy="17" r="2.6"/><circle cx="18" cy="17" r="2.6"/><path d="M8.6 17h6.8M15 7h2.5l2 6.5M11 17l1.5-6H8M17.4 13.5h-5"/>',
  flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  chek: '<path d="M6 3h12v18l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>'
};
const bi = k => `<svg class="bi" viewBox="0 0 24 24" aria-hidden="true">${BI[k]}</svg>`;
const COLS = [
  ['c-new', bi('clock') + 'Yangi', o => o.status === 'new'],
  ['c-cook', bi('chef') + 'Tayyorlanmoqda', o => o.status === 'accepted' || o.status === 'cooking'],
  ['c-ready', bi('box') + 'Tayyor', o => o.status === 'ready'],
  ['c-way', bi('moto') + 'Yo\'lda', o => o.status === 'onway'],
  ['c-done', bi('flag') + 'Yakunlangan', o => o.status === 'delivered' || o.status === 'cancelled'],
];

function loadCat() { fetch('index.html').then(r => r.text()).then(h => { BASEP = JSON.parse(h.match(/const P=(\[.*?\])\.map\(/s)[1]); buildCat(); }).catch(() => {}); }

}

function connect() {
  es && es.close();
  es = new EventSource('api/staff/stream?st=' + encodeURIComponent(TOK));
  es.onopen = () => { $('#conn').className = 'pill on'; $('#conn').textContent = '● Jonli'; };
  es.onerror = () => {
    $('#conn').className = 'pill bad'; $('#conn').textContent = 'Aloqa uzildi, qayta ulanmoqda...';
    // Kirish muddati tugagan bo'lsa — qayta kirish oynasi (aks holda abadiy "ulanmoqda")
    clearTimeout(connect.t); connect.t = setTimeout(() => api('staff/me').catch(x => { if (x.status === 401) { ss.set('uzb_staff', ''); location.reload(); } }), 8000);
  };
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'all') {
      const prev = ORD, had = Object.keys(prev).length;
      ORD = {}; d.orders.forEach(o => (ORD[o.id] = o)); setBR(d.branches); STOP = new Set(d.stop);
      // Aloqa uzilib qolgan paytda kelgan yangi buyurtmalar ham signal bersin
      if (had) { const nw = d.orders.filter(o => o.status === 'new' && !prev[o.id]); if (nw.length) { beep(); nw.forEach(o => { fresh.add(o.id); notify(o); }); } }
      if (d.menu) { MENUCFG = d.menu; buildCat(); }
      if (d.ops) { OPSD = d.ops; pauseUi(); }
      if (!STAFF.length && ME.branch == null) api('staff/list').then(l => { STAFF = l; draw(); }).catch(() => {});
    }
    if (d.type === 'order') {
      const isNew = !ORD[d.order.id];
      ORD[d.order.id] = d.order;
      if (isNew && d.order.status === 'new') { fresh.add(d.order.id); beep(); notify(d.order); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} toast(`🔔 Yangi buyurtma #${d.order.no} — ${d.order.name}`); setTimeout(() => { fresh.delete(d.order.id); draw(); }, 15000); }
      if (d.order.status === 'cancelled' && d.order.cancelledBy === 'customer') toast(`✖️ Mijoz #${d.order.no} ni bekor qildi`);
    }
    if (d.type === 'menu') { STOP = new Set(d.stop); if (d.branches) setBR(d.branches); if (d.menu) { MENUCFG = d.menu; buildCat(); } if (d.ops) { OPSD = d.ops; pauseUi(); if (view === 'settings' && !$('#v-settings').contains(document.activeElement)) settingsView(); } if (view === 'menu') menuView(); }
    draw();
  };
}

function card(o) {

    <div class="who"><b>${esc(o.name)}</b><span class="tel">${esc(o.phone)}</span></div>
    <div style="font-size:13px">📍 ${esc(o.addr || '—')}${o.dist != null ? ` · ${o.dist} km` : ''} ${o.lat != null ? `· <a href="${U.navLink({ lat: o.lat, lng: o.lng })}" target="_blank" rel="noopener">xaritada</a>` : ''}</div>

      <div class="sum">${o.del ? `<div><span>Yetkazish</span><span>${U.money(o.del)}</span></div>` : ''}${o.disc ? `<div><span>Chegirma ${esc(o.promo || '')}</span><span>−${U.money(o.disc)}</span></div>` : ''}

    ${actions(o)}</article>`;

  const cols = COLS.map(([cls, title, f]) => {

    if (cls === 'c-done') items = items.filter(o => (o.history.delivered || o.history.cancelled || 0) > done).slice(0, 30);
    if (cls === 'c-new') items.reverse();
    return { cls, title, items };
  });

// Rasmni 480×480 ga kichraytirish (kvadrat ichiga, fon shaffof qoladi)
async function toDataUrl(file) {
  const u = URL.createObjectURL(file);
  try {
    const im = await new Promise((ok, bad) => { const x = new Image(); x.onload = () => ok(x); x.onerror = bad; x.src = u; });
    const S = 480, c = document.createElement('canvas'); c.width = c.height = S;
    const k = Math.min(S / im.naturalWidth, S / im.naturalHeight), w = im.naturalWidth * k, h = im.naturalHeight * k;
    c.getContext('2d').drawImage(im, (S - w) / 2, (S - h) / 2, w, h);
    let url = c.toDataURL('image/webp', 0.86);
    if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/png');
    if (url.length > 1.1e6) url = c.toDataURL('image/jpeg', 0.86);
    return url;
  } finally { URL.revokeObjectURL(u); }
}

      <div class="row"><button type="button" class="btn red sm" data-pz="30">30 daqiqaga to'xtatish</button><button type="button" class="btn red sm" data-pz="60">1 soatga</button><button type="button" class="btn red sm" data-pz="-1">Qo'lda yoqilguncha</button><button type="button" class="btn ok sm" data-pz="0">Qayta ochish</button></div>
      <p class="hint">Oshxona to'lib ketsa, svet yoki gaz o'chsa — buyurtma qabul qilishni to'xtating. Mijozlar saytda "vaqtincha to'xtatilgan" yozuvini ko'radi.${master ? ' Bitta filial to\'xtatilsa, yetkazish buyurtmalari keyingi eng yaqin filialga tushadi.' : ''}</p>
      ${master && Object.keys(o.pauseBr || {}).length ? `<div class="hint">To'xtatilgan filiallar: ${Object.entries(o.pauseBr).map(([i, q]) => esc(BR[i] || '') + (q.until ? ' (' + U.time(q.until) + ' gacha)' : '')).join(', ')}</div>` : ''}
    </div>
    ${master ? `<form class="glass" id="hrsF"><h2>Ish vaqti</h2>
      <div class="zrow"><label style="display:grid;gap:4px"><span class="lbl2">Ochiladi</span><select class="fld" id="hF">${hOpts(o.from)}</select></label><label style="display:grid;gap:4px"><span class="lbl2">Yopiladi</span><select class="fld" id="hT">${hOpts(o.to)}</select></label></div>
      <p class="hint">O'zbekiston vaqti. Yopilish ertasi kun bo'lsa ham bo'ladi (09:00 → 03:00). Ikkalasi bir xil bo'lsa — kun bo'yi ochiq. Hozir: <b>${esc(o.hours || '')}</b>, ${o.open ? 'ochiq' : 'yopiq'}.</p>
      <div class="err" id="hErr"></div><button class="btn sm" style="justify-self:start">Saqlash</button></form>
    <form class="glass" id="zF"><h2>Yetkazish narxi</h2>
      <div class="hint">Mijozdan eng yaqin ochiq filialgacha bo'lgan masofaga qarab. Chap: necha km gacha, o'ng: narxi.</div>
      <div style="display:grid;gap:6px">${[0, 1, 2, 3, 4, 5].map(i => `<div class="zrow"><input class="fld" data-zk="${i}" inputmode="decimal" placeholder="km gacha" value="${z[i] ? z[i][0] : ''}"><input class="fld" data-zp="${i}" inputmode="numeric" placeholder="so'm" value="${z[i] ? z[i][1] : ''}"></div>`).join('')}</div>
      <div class="zrow"><label style="display:grid;gap:4px"><span class="lbl2">Eng uzoq masofa, km</span><input class="fld" id="zMax" inputmode="decimal" value="${o.maxKm ?? ''}"></label><label style="display:grid;gap:4px"><span class="lbl2">Bepul yetkazish, so'mdan</span><input class="fld" id="zFree" inputmode="numeric" value="${o.freeFrom ?? ''}"></label></div>
      <p class="hint">Bo'sh qatorlar hisobga olinmaydi. "Bepul yetkazish" 0 bo'lsa — bepul yetkazish bo'lmaydi.</p>
      <div class="err" id="zErr"></div><button class="btn sm" style="justify-self:start">Saqlash</button></form>` : ''}
    <div class="glass"><h2>Shu qurilma (oshxona planshet yoki kompyuteri)</h2>
      <label class="tg"><span>Yangi buyurtma ovozi</span><input type="checkbox" data-dev="snd" ${sound ? 'checked' : ''}></label>
      <label class="tg"><span>Qabul qilinmaguncha har 20 soniyada takrorlansin</span><input type="checkbox" data-dev="rep" ${dev.rep ? 'checked' : ''}></label>
      <label class="tg"><span>Ekran o'chib qolmasin</span><input type="checkbox" data-dev="wake" ${dev.wake ? 'checked' : ''}></label>
      <label class="tg"><span>"Qabul qilish" bosilganda chek avtomatik chiqsin</span><input type="checkbox" data-dev="print" ${dev.print ? 'checked' : ''}></label>
      <div class="row"><button type="button" class="btn ghost sm" id="notifB">${notifTxt()}</button><button type="button" class="btn ghost sm" id="testB">Ovozni sinash</button></div>
      <p class="hint">Chek printeri: 80 mm termoprinter. Chrome'ni <span class="kbd">--kiosk-printing</span> belgisi bilan ochsangiz, chek oynasiz to'g'ridan-to'g'ri chiqadi. Planshetni quvvatga ulab qo'ying.</p></div>
    <div class="glass"><h2>Mijoz parolini tiklash</h2>
      <p class="hint">Mijoz parolini unutib qo'ng'iroq qilsa: telefon raqamini yozing — vaqtinchalik parol chiqadi, uni mijozga ayting. Mijoz kirgach o'zi yangisini qo'yadi.</p>
      <div class="row"><input class="fld" id="rPh" type="tel" placeholder="+998 90 123 45 67" style="flex:1;min-width:180px"><button type="button" class="btn sm" id="rB">Parol berish</button></div><div id="rOut"></div></div>
    ${ME.id === 'master' ? `<div class="glass"><h2>Zaxira nusxa</h2><p class="hint">Barcha buyurtmalar, mijozlar, xodimlar, menyu va sozlamalar bitta faylga yuklanadi. Haftada bir marta yuklab, xavfsiz joyda saqlang (faylda mijozlarning shaxsiy ma'lumotlari bor).</p><button type="button" class="btn ghost sm" id="bkB" style="justify-self:start">Zaxira faylini yuklab olish</button></div>` : ''}
  </div>`;
  const hf = $('#hrsF');
  if (hf) hf.onsubmit = async e => { e.preventDefault(); try { OPSD = await api('staff/ops', { body: { from: +$('#hF').value, to: +$('#hT').value } }); toast('Ish vaqti saqlandi'); settingsView(); } catch (x) { $('#hErr').textContent = errMsg(x); } };
  const zf = $('#zF');
  if (zf) zf.onsubmit = async e => {
    e.preventDefault();
    const zones = [0, 1, 2, 3, 4, 5].map(i => [document.querySelector(`[data-zk="${i}"]`).value.replace(',', '.').trim(), document.querySelector(`[data-zp="${i}"]`).value.replace(/\D/g, '')]).filter(x => x[0] && x[1] !== '').map(x => [+x[0], +x[1]]);
    if (!zones.length) return ($('#zErr').textContent = 'Kamida bitta qator to\'ldiring');
    try { OPSD = await api('staff/ops', { body: { zones, maxKm: +String($('#zMax').value).replace(',', '.'), freeFrom: +String($('#zFree').value).replace(/\D/g, '') || 0 } }); toast('Yetkazish narxi saqlandi'); settingsView(); }
    catch (x) { $('#zErr').textContent = { zones: 'Masofa 0.5–100 km, narx 0–500 000 so\'m bo\'lsin, masofalar takrorlanmasin', maxkm: 'Eng uzoq masofa 1–100 km', free: 'Bepul yetkazish summasi noto\'g\'ri' }[x.message] || errMsg(x); }
  };
  $('#notifB').onclick = async () => { try { if ('Notification' in window) await Notification.requestPermission(); } catch (e) {} settingsView(); };
  $('#testB').onclick = () => { unlockAudio(); const s0 = sound; sound = true; beep(); sound = s0; };
  $('#rB').onclick = async () => {
    const out = $('#rOut');
    try { const r = await api('staff/user-reset', { body: { phone: $('#rPh').value } }); out.innerHTML = `<div class="note">Mijoz: <b>${esc(r.name)}</b> ${esc(r.phone)}<br>Yangi parol: <span class="newpw">${esc(r.password)}</span><br><span class="hint">Mijozga ayting. Kirgach o'zi yangi parol qo'yadi.</span></div>`; }
    catch (x) { out.innerHTML = `<div class="err">${x.message === 'nouser' ? 'Bu raqam bilan mijoz topilmadi' : errMsg(x)}</div>`; }
  };
  const bk = $('#bkB'); if (bk) bk.onclick = () => download('staff/backup', `uzbegim-zaxira-${new Date().toISOString().slice(0, 10)}.json`);
}
document.addEventListener('change', e => {
  const d = e.target.closest('[data-dev]'); if (!d) return;
  const k = d.dataset.dev;
  if (k === 'snd') { sound = d.checked; ss.set('uzb_snd', sound ? '1' : '0'); const b = $('#snd'); if (b) { b.innerHTML = sound ? ICN.bell : ICN.mute; b.classList.toggle('off', !sound); } alarmUi(); if (sound) { unlockAudio(); beep(); } return; }
  dev[k] = d.checked; devSave(); if (k === 'wake') wake();
});
// Qabul qilinmagan buyurtma turganda signal takrorlanadi, sarlavha miltillaydi
setInterval(() => { if (!ME || !dev.rep) return; if (Object.values(ORD).some(o => o.status === 'new')) { beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} } }, 20000);
let flashOn = false;
setInterval(() => { const n = Object.values(ORD).filter(o => o.status === 'new').length; if (!n || !document.hidden) return; flashOn = !flashOn; document.title = flashOn ? `🔔 ${n} ta YANGI BUYURTMA` : `(${n}) Uzbegim Oshxona`; }, 1200);

/* ---- Hisobot */
async function stats(days) {
  const el = $('#v-stats');
  el.innerHTML = '<div class="hint">Yuklanmoqda...</div>';
  try {
    const s = await api('staff/stats?days=' + days);
    el.innerHTML = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><h2 style="font-size:18px;margin-right:auto">Hisobot</h2>${[[1, 'Bugun'], [7, '7 kun'], [30, '30 kun']].map(([d, n]) => `<button class="btn ${d === days ? '' : 'ghost'}" data-days="${d}">${n}</button>`).join('')}<button class="btn ghost" data-exp="${days}" title="Buyurtmalar ro'yxati Excel uchun">Excel'ga yuklab olish</button></div>
      <div class="kpis">
        <div class="kpi"><span>Tushum (yetkazilgan)</span><b>${U.money(s.revenue)}</b> so'm</div>
        <div class="kpi"><span>Buyurtmalar</span><b>${s.orders}</b></div>
        <div class="kpi"><span>Yetkazilgan</span><b>${s.delivered}</b></div>
        <div class="kpi"><span>Bekor qilingan</span><b>${s.cancelled}</b></div>
        <div class="kpi"><span>O'rtacha chek</span><b>${U.money(s.avg)}</b> so'm</div>
        <div class="kpi"><span>Mijozlar bahosi</span><b>${s.rating ?? '—'}</b> ${s.ratedCount ? `<span class="hint" style="display:inline;text-transform:none">(${s.ratedCount} ta)</span>` : ''}</div>
      </div>
      <div class="grid2" style="margin-top:16px">
        <div class="glass" style="padding:16px"><h3 style="font-size:15px;margin-bottom:8px">Eng ko'p sotilgan</h3><div class="tw"><table><tr><th>Taom</th><th style="text-align:right">Soni</th></tr>${s.top.map(([n, q]) => `<tr><td>${esc(n)}</td><td class="num">${q}</td></tr>`).join('') || '<tr><td colspan="2" class="hint">Hali yo\'q</td></tr>'}</table></div></div>
        <div class="glass" style="padding:16px"><h3 style="font-size:15px;margin-bottom:8px">Filiallar</h3><div class="tw"><table><tr><th>Filial</th><th style="text-align:right">Buyurtma</th><th style="text-align:right">Tushum</th></tr>${s.byBranch.map(b => `<tr><td>${esc(b.name)}</td><td class="num">${b.count}</td><td class="num">${U.money(b.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="hint">Hali yo\'q</td></tr>'}</table></div></div>
      </div>`;
  } catch (x) { el.innerHTML = `<div class="err">${errMsg(x)}</div>`; }
}

/* ---- Vakansiya arizalari */
async function appsCount() { try { const l = await api('staff/apps'); const n = l.filter(a => !a.seen).length; const el = $('#appsN'); if (el) { el.hidden = !n; el.textContent = n; } return l; } catch (e) { return []; } }
async function appsView() {
  const l = await appsCount();
  $('#v-apps').innerHTML = `<h2 style="font-size:18px;margin-bottom:12px">Vakansiyaga arizalar</h2><div class="glass" style="padding:16px"><div class="tw"><table><tr><th>Sana</th><th>Lavozim</th><th>Ism</th><th>Telefon</th><th>Yosh</th><th>Tajriba</th><th></th></tr>
    ${l.map(a => `<tr style="${a.seen ? 'opacity:.55' : ''}"><td>${new Date(a.createdAt).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${esc(a.pos)}</td><td>${esc(a.name)}</td><td class="tel">${esc(a.phone)}</td><td>${a.age || ''}</td><td style="max-width:320px">${esc(a.exp)}</td><td><button class="btn ghost" style="height:34px" data-seen="${a.id}" data-v2="${a.seen ? '' : '1'}">${a.seen ? 'Qaytarish' : 'Ko\'rildi'}</button></td></tr>`).join('') || '<tr><td colspan="7" class="hint">Hali ariza yo\'q</td></tr>'}
  </table></div></div>`;
}

/* ---- Xodimlar (faqat bosh admin) */
async function staffView(edit) {
  const el = $('#v-staff');
  try { STAFF = await api('staff/list'); } catch (x) { el.innerHTML = `<div class="err">${errMsg(x)}</div>`; return; }
  const s = edit ? STAFF.find(x => x.id === edit) : null;
  el.innerHTML = `<div class="grid2">
    <form class="glass" id="sf" style="padding:18px;display:grid;gap:10px;align-content:start">
      <h2 style="font-size:17px">${s ? 'Xodimni tahrirlash' : 'Yangi xodim'}</h2>
      <input class="fld" id="sName" placeholder="Ism" value="${esc(s?.name || '')}">
      <input class="fld" id="sPhone" type="tel" placeholder="Telefon +998..." value="${esc(s?.phone || '+998 ')}">
      <select class="fld" id="sRole"><option value="courier" ${s?.role === 'courier' ? 'selected' : ''}>Kuryer</option><option value="admin" ${s?.role === 'admin' ? 'selected' : ''}>Oshxona xodimi</option></select>
      <select class="fld" id="sBranch"><option value="">Barcha filiallar</option>${BR.map((n, i) => brOk(i, s?.branch) ? `<option value="${i}" ${s?.branch === i ? 'selected' : ''}>${esc(n)}</option>` : '').join('')}</select>
      <input class="fld" id="sPin" type="password" inputmode="numeric" placeholder="${s ? 'Yangi PIN (o\'zgartirmasangiz bo\'sh qoldiring)' : 'PIN (kamida 6 raqam)'}">
      ${s ? `<label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="sActive" ${s.active ? 'checked' : ''}> Faol (o'chirsangiz kira olmaydi)</label>` : ''}
      <div class="err" id="sErr"></div>
      <div style="display:flex;gap:8px"><button class="btn">${s ? 'Saqlash' : 'Qo\'shish'}</button>${s ? '<button type="button" class="btn ghost" id="sCancel">Bekor</button>' : ''}</div>
      <p class="hint">Xodim telefoni va PIN bilan kiradi: oshxona xodimi — admin.html, kuryer — courier.html. Filial tanlansa, faqat o'sha filial buyurtmalarini ko'radi.</p>
    </form>
    <div class="glass" style="padding:18px"><h2 style="font-size:17px;margin-bottom:8px">Xodimlar (${STAFF.length})</h2><div class="tw"><table><tr><th>Ism</th><th>Telefon</th><th>Lavozim</th><th>Filial</th><th></th></tr>
      ${STAFF.map(x => `<tr style="${x.active ? '' : 'opacity:.5'}"><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${x.role === 'admin' ? 'Oshxona' : 'Kuryer'}</td><td>${x.branch == null ? 'Barchasi' : esc(BR[x.branch])}</td><td><button class="btn ghost" style="height:34px" data-edit="${x.id}">Tahrir</button></td></tr>`).join('') || '<tr><td colspan="5" class="hint">Hali xodim yo\'q. Chapdan qo\'shing.</td></tr>'}
    </table></div></div></div>`;
  $('#sf').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('staff/save', { body: { id: s?.id, name: $('#sName').value, phone: $('#sPhone').value, role: $('#sRole').value, branch: $('#sBranch').value, pin: $('#sPin').value.trim() || undefined, active: s ? $('#sActive').checked : true } });
      toast('Saqlandi'); staffView();
    } catch (x) { $('#sErr').textContent = errMsg(x); }
  };
  if (s) $('#sCancel').onclick = () => staffView();
}

document.addEventListener('click', async e => {
  const sn = e.target.closest('[data-seen]'); if (sn) { await api('staff/apps', { body: { id: sn.dataset.seen, seen: !!sn.dataset.v2 } }).catch(() => {}); return appsView(); }
  const bn = e.target.closest('[data-brnew]'); if (bn) return branchView();
  const be = e.target.closest('[data-bredit]'); if (be) return branchView(+be.dataset.bredit);
  const pr = e.target.closest('[data-print]'); if (pr) return printOrder(ORD[pr.dataset.print]);
  const ed = e.target.closest('[data-edit]'); if (ed) return staffView(ed.dataset.edit);
  const dd = e.target.closest('[data-days]'); if (dd) return stats(+dd.dataset.days);
  const ex = e.target.closest('[data-exp]'); if (ex) return download('staff/export?days=' + ex.dataset.exp, `uzbegim-buyurtmalar-${ex.dataset.exp}-kun.csv`);
  const mc = e.target.closest('[data-mcat]'); if (mc) { mCat = mc.dataset.mcat; return menuView(); }
  if (e.target.closest('[data-mnew]')) return menuEdit(null);
  const me2 = e.target.closest('[data-medit]'); if (me2) return menuEdit(me2.dataset.medit);
  if (e.target.closest('[data-mclose]') || e.target.id === 'dlg') return closeDlg();
  const vd = e.target.closest('[data-vdel]'); if (vd) { readVars(); MED.v.splice(+vd.dataset.vdel, 1); return drawVars(); }
  if (e.target.closest('[data-mreset]') || e.target.closest('[data-mdel]')) {
    const del = !!e.target.closest('[data-mdel]');
    if (!confirm(del ? 'Bu mahsulot menyudan butunlay o\'chirilsinmi?' : 'Narx, nom va rasm asl holiga qaytarilsinmi?')) return;
    try { const r = await api('staff/menu', { body: { id: MED.id, [del ? 'remove' : 'reset']: true } }); MENUCFG = r.menu; buildCat(); closeDlg(); toast(del ? 'O\'chirildi' : 'Asl holiga qaytarildi'); } catch (x) { toast(errMsg(x)); }
    return;
  }
  const pzb = e.target.closest('[data-pz]');
  if (pzb) {
    const m = +pzb.dataset.pz, br = $('#pzBr') ? $('#pzBr').value : '';
    try { OPSD = await api('staff/ops', { body: { pause: m === 0 ? false : m === -1 ? true : m, msg: $('#pzMsg') ? $('#pzMsg').value : '', branch: br } }); pauseUi(); if (view === 'settings') settingsView(); toast(m === 0 ? 'Buyurtma qabul qilish qayta ochildi' : 'Buyurtma qabul qilish to\'xtatildi'); }
    catch (x) { toast(errMsg(x)); }
    return;
  }
  const g2 = e.target.closest('[data-v2go]'); if (g2) { const b2 = document.querySelector(`#tabs [data-v="${g2.dataset.v2go}"]`); if (b2) b2.click(); return; }
  const sp = e.target.closest('[data-stop]');
  if (sp) { const id = sp.dataset.stop; try { const r = await api('staff/stop', { body: { id, stop: !STOP.has(id) } }); STOP = new Set(r.stop); menuView(); } catch (x) { toast(errMsg(x)); } return; }
  const b = e.target.closest('[data-st]');
  if (!b) return;
  const id = b.dataset.id, st = b.dataset.st, body = { status: st };
  if (st === 'cancelled') {
    const box = document.getElementById('rj-' + id);
    if (box.hidden) { box.hidden = false; b.textContent = 'Rad etishni tasdiqlash'; return; }
    body.reason = [document.getElementById('rr-' + id).value, document.getElementById('rt-' + id).value.trim()].filter(Boolean).join('. ');
  }
  if (st === 'onway') {
    const sel = document.getElementById('cs-' + id).value;
    if (!sel) return toast('Kuryerni tanlang');
    if (sel === 'manual') { const n = document.getElementById('cn-' + id).value.trim(); if (!n) return toast('Kuryer ismini yozing'); body.courier = { name: n, phone: document.getElementById('cp-' + id).value.trim() }; }
    else body.courier = { id: sel };
  }
  b.disabled = true;
  try { const r = await api(`orders/${id}/status`, { body }); if (st === 'accepted' && dev.print && r) printOrder(r); }
  catch (x) { b.disabled = false; toast(errMsg(x)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
setInterval(() => Object.keys(ORD).length && view === 'board' && draw(), 30000);
// Sahifa yangilansa kirish saqlanadi. Faqat server "kirish yaroqsiz" (401) desa chiqaramiz;
// server uyg'onayotgan bo'lsa (Render) kutib, qayta urinamiz.
async function boot(k = 0) {
  if (!TOK) return loginView();
  try { const s = await api('staff/me'); if (s.role !== 'admin') { ss.set('uzb_staff', ''); return loginView('Bu kuryer akkaunti. Kuryerlar courier.html sahifasidan kiradi.'); } ME = s; start(); }
  catch (x) {
    if (x.status === 401 || x.status === 403) { ss.set('uzb_staff', ''); return loginView(); }
    $('#app').innerHTML = `<div class="login glass" style="text-align:center"><b>Server bilan ulanmoqda...</b><p class="hint">Internet yoki server uyg'onishini kutyapmiz${k ? ' (' + k + ')' : ''}</p></div>`;
    setTimeout(() => boot(k + 1), 3000);
  }
}
boot();
</script>
</body>
</html>
