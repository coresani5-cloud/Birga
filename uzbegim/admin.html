<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uzbegim Oshxona</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="staff.css">
<style>
.tabsbar{display:flex;gap:6px;flex-wrap:wrap}
.tabsbar button{height:40px;padding:0 16px;border-radius:12px;font-weight:800;background:var(--glass);border:1px solid var(--ln)}
.tabsbar button.on{background:var(--grad);color:#120d09;border-color:transparent}
.top2{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 14px;padding:10px max(16px,env(safe-area-inset-left,0px));background:rgba(15,12,10,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.top2 .brand{font-size:17px}
.tools{display:flex;gap:8px;align-items:center}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--ln)}
.ib svg{width:20px;height:20px}.ib.off{color:var(--mut)}
.tabsbar{grid-column:1/-1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.tabsbar::-webkit-scrollbar{display:none}
.tabsbar button{flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.tabsbar button.on .badge{background:#120d09;color:#fff}
@media (min-width:901px){.top2{grid-template-columns:auto 1fr auto}.tabsbar{grid-column:2;grid-row:1}}
.btool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn.sm{height:40px;padding:0 14px;font-size:13px}.btn.sm svg{width:18px;height:18px}
.btn.ghost.on{border-color:var(--or);color:var(--or2)}
.stabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;position:sticky;top:118px;z-index:10;padding:6px 0;background:var(--bg)}
.stabs:empty{display:none}
.stabs::-webkit-scrollbar{display:none}
.stabs button{flex:none;height:40px;padding:0 12px;border-radius:12px;background:var(--glass);border:1px solid var(--ln);font-weight:800;font-size:13px;display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.stabs button span{min-width:22px;height:22px;border-radius:99px;background:var(--glass2);display:grid;place-items:center;font-size:12px}
.stabs button.on{background:var(--grad);color:#120d09;border-color:transparent}
.stabs button.on span{background:rgba(0,0,0,.18)}
.stabs button.hot:not(.on){border-color:var(--or)}.stabs button.hot span{background:var(--red);color:#fff}
.board.mob{display:block}.board.mob .col{gap:12px}
.where{display:flex;align-items:center;gap:6px;font-size:13px;padding:8px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--ln)}
.where b{color:var(--mut);font-weight:700}
.where.warn{border-color:rgba(255,122,0,.45);background:rgba(255,122,0,.1)}
.where.on{border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08)}
.where.bad{border-color:rgba(255,90,78,.4);background:rgba(255,90,78,.08)}
.items2{display:grid;gap:6px;border-top:1px dashed var(--ln);padding-top:8px}
.it{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center}
.it img,.it .noimg{width:44px;height:44px;border-radius:10px;object-fit:contain;background:rgba(255,255,255,.05)}
.it .m{min-width:0}.it b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.it small{color:var(--mut);font-size:12px}
.it .q{color:var(--or2);font-weight:800;font-size:13px}.it .pr{font-variant-numeric:tabular-nums;font-size:13px;min-width:62px;text-align:right}
.items2 .sum{border-top:1px dashed var(--ln);padding-top:6px;font-size:13px;color:var(--mut);display:grid;gap:2px}
.items2 .sum>div{display:flex;justify-content:space-between}.items2 .sum .tot{color:var(--ink);font-weight:800;font-size:15px}
.acts2{display:grid;gap:8px}
.acts2 .big2{height:52px;font-size:16px;width:100%}
.acts2 .sec{display:flex;gap:8px}.acts2 .sec .btn{flex:1;height:42px;font-size:13px}
#ovMapW[hidden]{display:none}
#print{display:none}
@media print{body::before{display:none!important}body{background:#fff!important}
  @page{margin:6mm}
  body{background:#fff!important}
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;font:13px/1.35 Manrope,Arial,sans-serif}
  .rc{width:76mm;margin:0 auto}
  .rc-h{display:flex;gap:10px;align-items:center;justify-content:center;padding-bottom:8px;border-bottom:2px dashed #000}
  .rc-h img{width:44px;height:44px}.rc-h b{display:block;font-size:20px;letter-spacing:.12em}.rc-h small{font-size:12px}
  .rc-no{text-align:center;font-size:30px;font-weight:900;margin:8px 0}
  .rc-meta .r,.rc-sum .r{display:flex;justify-content:space-between;gap:10px;padding:1px 0}
  .rc-meta .r span:first-child{color:#555}
  .rc-note{margin:6px 0;padding:6px;border:1px solid #000;border-radius:6px;font-weight:700}
  .rc-items{border-top:2px dashed #000;border-bottom:2px dashed #000;margin:8px 0;padding:6px 0;display:grid;gap:6px}
  .ri{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;break-inside:avoid}
  .ri img,.ri .noimg{width:42px;height:42px;object-fit:contain}
  .ri b{display:block;font-size:13px}.ri small{display:block;font-size:11px;color:#444}.ri .s{font-weight:800}
  .rc-sum .tot{font-size:17px;font-weight:900;border-top:1px solid #000;margin-top:4px;padding-top:4px}
  .rc-f{text-align:center;margin-top:10px;font-size:11px;color:#333}
}
.board{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.col>h3{font-size:14px;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--ln)}
.col>h3 .n{font-family:Manrope;font-size:12px;min-width:24px;height:24px;border-radius:99px;display:grid;place-items:center;background:var(--glass2)}
.col.c-new>h3{border-color:rgba(255,122,0,.5)}
.col.c-new>h3 .n{background:var(--grad);color:#120d09}
.empty{padding:20px 10px;text-align:center;color:var(--mut);font-size:13px;border:1px dashed var(--ln);border-radius:16px}
#ovMap{height:300px;border-radius:20px;overflow:hidden;margin-bottom:14px;border:1px solid var(--ln)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.cour{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cform{display:grid;gap:6px;width:100%}
.cform input,.cform select,.fld{height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--glass);padding:0 10px;outline:none;font-size:13px;color:var(--ink)}
.cform select option,.fld option{background:#17120e}
.stars{color:#d9b35b;letter-spacing:1px}
.view[hidden]{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--ln)}
.kpi span{display:block;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:Unbounded;font-size:24px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.board{grid-template-columns:repeat(5,85vw);scroll-snap-type:x mandatory}.col{scroll-snap-align:start}.grid2{grid-template-columns:1fr}}
.menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.mi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--ln)}
.mi img{width:46px;height:46px;object-fit:contain}
.mi .t{flex:1;min-width:0;font-size:13px;font-weight:700}
.mi.off{border-color:rgba(255,90,78,.45);background:rgba(255,90,78,.08)}
.sw{width:46px;height:26px;border-radius:99px;background:var(--ok);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:23px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.mi.off .sw{background:#555}.mi.off .sw::after{left:3px}

</style>
</head>
<body>
<div class="flag"></div>
<div id="app"></div>
<div id="print"></div>
<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
const U = UZB;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const LOGO = '<img src="logo.svg" alt="" style="width:40px;height:40px;border-radius:50%">';
const ss = { get(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { v ? localStorage.setItem(k, v) : (localStorage.removeItem(k), sessionStorage.removeItem(k)); } catch (e) {} } };
let TOK = ss.get('uzb_staff'), ME = null, ORD = {}, BR = [], STOP = new Set(), STAFF = [], es = null, map = null, mk = {}, sound = ss.get('uzb_snd') !== '0', fresh = new Set(), branchF = ss.get('uzb_brf'), view = ss.get('uzb_view') || 'board', colSel = ss.get('uzb_col') || 'c-new', CATI = {};
let tt; function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 2800); }
const api = (p, o = {}) => U.api(p, { ...o, headers: { Authorization: 'Bearer ' + TOK } });
const ERR = { forbidden: 'Bu amalga ruxsat yo\'q', closed_order: 'Buyurtma allaqachon yopilgan', exists: 'Bu telefon bilan xodim bor', pin: 'PIN kamida 6 ta raqamdan iborat bo\'lsin', name_phone: 'Ism va telefonni to\'liq yozing', auth: 'Qayta kiring', slow: 'Ko\'p urinish, bir daqiqa kuting' };
const errMsg = x => ERR[x.message] || (x.status ? 'Xato: ' + x.message : 'Server bilan aloqa yo\'q');

function beep() {
  if (!sound) return;
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18, .36].forEach((d, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = [880, 1175, 1568][i]; g.gain.setValueAtTime(.2, a.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d + .16); o.connect(g).connect(a.destination); o.start(a.currentTime + d); o.stop(a.currentTime + d + .17); });
  } catch (e) {}
}

function loginView(msg = '') {
  $('#app').innerHTML = `<form class="login glass" id="lf">
    <div class="brand">${LOGO}<div>Uzbegim<small>Oshxona paneli</small></div></div>
    <p class="hint">Xodim telefoni va PIN kodi bilan kiring. Bosh admin faqat PIN kiritadi.</p>
    <input id="ph" type="tel" placeholder="Telefon (bosh admin uchun bo'sh qoldiring)" autocomplete="username">
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN kod" autocomplete="current-password">
    <div class="err">${esc(msg)}</div>
    <button class="btn big">Kirish</button></form>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await U.api('staff/login', { body: { phone: $('#ph').value, pin: $('#pin').value.trim() } });
      if (r.staff.role !== 'admin') return loginView('Bu kuryer akkaunti. Kuryerlar courier.html sahifasidan kiradi.');
      TOK = r.token; ss.set('uzb_staff', TOK); ME = r.staff; start();
    } catch (x) { loginView(x.status === 401 ? 'Telefon yoki PIN noto\'g\'ri' : errMsg(x)); }
  };
}

const COLS = [
  ['c-new', '🕓 Yangi', o => o.status === 'new'],
  ['c-cook', '👨‍🍳 Tayyorlanmoqda', o => o.status === 'accepted' || o.status === 'cooking'],
  ['c-ready', '📦 Tayyor', o => o.status === 'ready'],
  ['c-way', '🛵 Yo\'lda', o => o.status === 'onway'],
  ['c-done', '✔ Yakunlangan', o => o.status === 'delivered' || o.status === 'cancelled'],
];

const ICN = { bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>', mute: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 9.5-4.9M18 11v5l1.5 2H9"/><path d="M10 20a2 2 0 0 0 4 0M3 3l18 18"/></svg>', out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg>', map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>' };
const isMob = () => matchMedia('(max-width: 900px)').matches;
function start() {
  const isMaster = ME.branch == null;
  if (!isMaster && ['branches', 'staff'].includes(view)) view = 'board';
  const T = [['board', 'Buyurtmalar'], ['menu', 'Stop-list'], ['stats', 'Hisobot'], ['apps', 'Arizalar']].concat(isMaster ? [['branches', 'Filiallar'], ['staff', 'Xodimlar']] : []);
  $('#app').innerHTML = `<header class="top2">
      <div class="brand">${LOGO}<div>Uzbegim<small>${esc(ME.name)}${ME.branch != null ? ' · ' + esc(BR[ME.branch] || '') : ''}</small></div></div>
      <div class="tools"><span class="pill" id="conn">Ulanmoqda...</span><button class="ib" id="snd" title="Ovoz"></button><button class="ib" id="out" title="Chiqish">${ICN.out}</button></div>
      <nav class="tabsbar" id="tabs">${T.map(([k, n]) => `<button data-v="${k}" class="${k === view ? 'on' : ''}">${n}${k === 'apps' ? ' <span class="badge" id="appsN" hidden></span>' : ''}${k === 'board' ? ' <span class="badge" id="newN" hidden></span>' : ''}</button>`).join('')}</nav>
    </header>
    <div class="wrap">
      <section class="view" id="v-board" ${view === 'board' ? '' : 'hidden'}>
        <div class="btool"><select class="fld" id="brf" ${ME.branch != null ? 'hidden' : ''}><option value="">Barcha filiallar</option></select><span class="pill" id="stats"></span><div class="grow"></div><button class="btn ghost sm" id="mapT">${ICN.map} <span>Xarita</span></button></div>
        <div id="ovMapW"><div id="ovMap"></div></div>
        <div class="stabs" id="stabs"></div>
        <div class="board" id="board"></div>
      </section>
      <section class="view" id="v-menu" ${view === 'menu' ? '' : 'hidden'}><h2 style="font-size:18px;margin-bottom:6px">Stop-list</h2><p class="hint" style="margin-bottom:14px">Tugagan taomni o'chiring — mijozlar uni "Tugagan" deb ko'radi va buyurtma qila olmaydi.</p><div class="menu-list" id="menuList"></div></section>
      <section class="view" id="v-stats" ${view === 'stats' ? '' : 'hidden'}></section>
      <section class="view" id="v-staff" ${view === 'staff' ? '' : 'hidden'}></section>
      <section class="view" id="v-apps" ${view === 'apps' ? '' : 'hidden'}></section>
      <section class="view" id="v-branches" ${view === 'branches' ? '' : 'hidden'}></section>
    </div>`;
  const sndUi = () => { $('#snd').innerHTML = sound ? ICN.bell : ICN.mute; $('#snd').classList.toggle('off', !sound); $('#snd').title = sound ? 'Ovoz yoqilgan' : "Ovoz o'chiq"; };
  sndUi();
  $('#out').onclick = () => { ss.set('uzb_staff', ''); es && es.close(); location.reload(); };
  $('#snd').onclick = () => { sound = !sound; ss.set('uzb_snd', sound ? '1' : '0'); sndUi(); toast(sound ? 'Ovoz yoqildi' : "Ovoz o'chirildi"); if (sound) beep(); };
  $('#brf').onchange = () => { branchF = $('#brf').value; ss.set('uzb_brf', branchF); draw(); };
  const mapOpen = () => ss.get('uzb_map') === '1' || (!ss.get('uzb_map') && !isMob());
  const mapUi = () => { $('#ovMapW').hidden = !mapOpen(); $('#mapT').classList.toggle('on', mapOpen()); if (mapOpen() && map) setTimeout(() => map.invalidateSize(), 50); };
  $('#mapT').onclick = () => { ss.set('uzb_map', mapOpen() ? '0' : '1'); mapUi(); };
  mapUi();
  const openView = v => { view = v; ss.set('uzb_view', v); document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.v === v)); document.querySelectorAll('.view').forEach(x => (x.hidden = x.id !== 'v-' + v)); if (v === 'stats') stats(1); if (v === 'staff') staffView(); if (v === 'menu') menuView(); if (v === 'apps') appsView(); if (v === 'branches') branchView(); if (v === 'board') draw(); };
  $('#tabs').onclick = e => { const b = e.target.closest('[data-v]'); if (b) openView(b.dataset.v); };
  $('#stabs').onclick = e => { const b = e.target.closest('[data-col]'); if (!b) return; colSel = b.dataset.col; ss.set('uzb_col', colSel); draw(); };
  addEventListener('resize', () => draw());
  appsCount(); setInterval(appsCount, 60000);
  loadCat();
  U.makeMap($('#ovMap'), U.CENTER, 11).then(m => { map = m; if (BRF.length) setBR(BRF); drawMap(); }).catch(() => { $('#ovMapW').hidden = true; });
  if (view !== 'board') setTimeout(() => openView(view), 0);
  connect();
}
// Menyu: taom rasmi va grammini olish uchun
function loadCat() { fetch('index.html').then(r => r.text()).then(h => { JSON.parse(h.match(/const P=(\[.*?\])\.map\(/s)[1]).forEach(p => (CATI[p.id] = p)); draw(); }).catch(() => {}); }
function itemInfo(i) {
  const [pid, vi] = String(i.id || '').split(':'), p = CATI[pid], v = p && p.v[+vi || 0];
  const name = p ? p.n.uz : i.n, size = i.s || (v ? (v.s ? v.s.uz : '') : ''), varL = p && p.v.length > 1 && v ? v.l.uz : '';
  return { pid, img: p ? p.img : i.img, name, sub: [varL, size].filter(Boolean).join(' · ') };
}
// Buyurtma hozir qayerda
function where(o) {
  return ({ new: ['🕓', 'Oshxona tasdiqlashini kutmoqda', ''], accepted: ['👨‍🍳', 'Oshxonada · navbatda', ''], cooking: ['👨‍🍳', 'Oshxonada · tayyorlanmoqda', ''],
    ready: o.mode === 'p' ? ['🛍', 'Filialda · mijoz olib ketadi', 'warn'] : ['📦', 'Oshxonada · kuryer kutilmoqda', 'warn'],
    onway: ['🛵', 'Kuryerda' + (o.courier ? ': ' + o.courier.name : ''), 'warn'], delivered: ['✔', o.mode === 'p' ? 'Mijozga berildi' : 'Mijozda · yetkazildi', 'on'], cancelled: ['✖', 'Bekor qilingan', 'bad'] })[o.status] || ['', o.status, ''];
}

let BRF = [], shopMk = [];
function setBR(list) {
  if (!Array.isArray(list)) return;
  BRF = list; U.setBranches(list);
  BR = list.map(b => b.name.uz + (b.active === false ? ' (yopiq)' : ''));
  const f = $('#brf');
  if (f) { const v = f.value; f.innerHTML = '<option value="">Barcha filiallar</option>' + BR.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join(''); f.value = v; }
  if (map && window.L) { shopMk.forEach(m => map.removeLayer(m)); shopMk = list.map(b => window.L.marker([b.lat, b.lng], { icon: U.pin(window.L, '🏪', 'shop'), opacity: b.active === false ? 0.4 : 1 }).addTo(map).bindTooltip(b.name.uz)); }
  if (view === 'branches' && !document.getElementById('bf')?.contains(document.activeElement)) branchView(editBr);
}

/* ---- Filiallar (faqat bosh admin) */
let editBr = null, brMap = null, brMk = null;
function branchView(i) {
  editBr = i === undefined || i === null ? null : i;
  const b = editBr != null ? BRF[editBr] : null;
  const el = $('#v-branches');
  el.innerHTML = `<div class="grid2">
    <div class="glass" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap"><h2 style="font-size:17px">Filiallar (${BRF.length})</h2><button class="btn" data-brnew>+ Yangi filial</button></div>
      <div class="tw"><table><tr><th>Nomi</th><th>Manzil</th><th>Ish vaqti</th><th></th></tr>

      <div id="bMap" style="height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--ln)"></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill" id="bCoord">${b ? b.lat.toFixed(5) + ', ' + b.lng.toFixed(5) : 'Joy tanlanmagan'}</span><button type="button" class="btn ghost" id="bHere" style="height:36px">Mening joylashuvim</button></div>

    pt = { lat: +(+p.lat).toFixed(6), lng: +(+p.lng).toFixed(6) };

  $('#bf').onsubmit = async e => {
    e.preventDefault();
    if (!pt) return ($('#bErr').textContent = 'Xaritada filial joyini belgilang');

  };
}

function connect() {
  es && es.close();
  es = new EventSource('api/staff/stream?st=' + encodeURIComponent(TOK));
  es.onopen = () => { $('#conn').className = 'pill on'; $('#conn').textContent = '● Jonli'; };
  es.onerror = () => { $('#conn').className = 'pill bad'; $('#conn').textContent = 'Aloqa uzildi, qayta ulanmoqda...'; };
  es.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'all') {
      ORD = {}; d.orders.forEach(o => (ORD[o.id] = o)); setBR(d.branches); STOP = new Set(d.stop);
      if (!STAFF.length && ME.branch == null) api('staff/list').then(l => { STAFF = l; draw(); }).catch(() => {});
    }
    if (d.type === 'order') {
      const isNew = !ORD[d.order.id];
      ORD[d.order.id] = d.order;
      if (isNew && d.order.status === 'new') { fresh.add(d.order.id); beep(); toast(`🔔 Yangi buyurtma #${d.order.no} — ${d.order.name}`); setTimeout(() => { fresh.delete(d.order.id); draw(); }, 15000); }
      if (d.order.status === 'cancelled' && d.order.cancelledBy === 'customer') toast(`✖️ Mijoz #${d.order.no} ni bekor qildi`);
    }
    if (d.type === 'menu') { STOP = new Set(d.stop); if (d.branches) setBR(d.branches); if (view === 'menu') menuView(); }
    draw();
  };
}

function actions(o) {
  const b = (st, label, cls = '') => `<button class="btn ${cls}" data-st="${st}" data-id="${o.id}">${label}</button>`;
  const rej = `<div class="cform" id="rj-${o.id}" hidden><select id="rr-${o.id}"><option>Taom tugagan</option><option>Manzil hududdan tashqarida</option><option>Mijoz bilan bog'lanib bo'lmadi</option><option>Oshxona yopilmoqda</option><option value="">Boshqa sabab (pastga yozing)</option></select><input id="rt-${o.id}" placeholder="Izoh (ixtiyoriy)"></div>`;
  const chek = `<button class="btn ghost" data-print="${o.id}" title="Chek chiqarish">🧾 Chek</button>`;
  const row = (main, ...sec) => `<div class="acts2">${main}<div class="sec">${sec.join('')}${chek}</div></div>`;
  switch (o.status) {
    case 'new': return row(b('accepted', '✅ Qabul qilish', 'ok big2'), b('cancelled', 'Rad etish', 'red')) + rej;
    case 'accepted': return row(b('cooking', '👨‍🍳 Tayyorlashni boshlash', 'big2'), b('cancelled', 'Bekor', 'red')) + rej;
    case 'cooking': return row(b('ready', '📦 Tayyor', 'big2'));
    case 'ready': {
      if (o.mode === 'p') return row(b('delivered', '🛍 Mijozga berildi', 'ok big2'));
      const cs = STAFF.filter(s => s.role === 'courier' && s.active && (s.branch == null || s.branch === o.branch));
      return `<div class="hint">Kuryer panelida ko'rinib turibdi — kuryer o'zi oladi. Yoki shu yerdan biriktiring:</div>
        <div class="cform"><select id="cs-${o.id}"><option value="">— kuryerni tanlang —</option>${cs.map(s => `<option value="${s.id}">${esc(s.name)} ${esc(s.phone)}</option>`).join('')}<option value="manual">Boshqa (qo'lda yozish)</option></select>
        <input placeholder="Kuryer ismi" id="cn-${o.id}" hidden><input placeholder="Kuryer telefoni" id="cp-${o.id}" value="+998 " hidden></div>` + row(b('onway', '🛵 Kuryerga berish', 'big2'));
    }
    case 'onway': return row(b('delivered', '🎉 Yetkazildi', 'ok big2'));
    default: return `<div class="acts2"><div class="sec">${chek}</div></div>`;
  }
}
function card(o) {
  const ago = Math.round((Date.now() - o.createdAt) / 60000);
  let gps = '';
  if (o.status === 'onway') {
    if (o.loc && o.lat != null) gps = `<span class="pill warn">📍 ${U.fmtDist(U.dist(o.loc, { lat: o.lat, lng: o.lng }))} qoldi · ${U.ago(o.loc.at)}</span>`;
    else gps = `<span class="pill">GPS kutilmoqda</span>`;
  }
  const w = where(o);
  return `<article class="card ${fresh.has(o.id) ? 'fresh' : ''}">
    <div class="h"><span class="no">#${o.no}</span><span class="pill ${o.mode === 'd' ? 'warn' : ''}">${o.mode === 'd' ? '🛵 Yetkazish' : '🏃 Olib ketish'}</span></div>
    <div class="where ${w[2]}"><span>${w[0]}</span><b>Hozir:</b> ${esc(w[1])}</div>
    <div class="hint">${U.time(o.createdAt)} · ${ago} daq oldin · 🏪 ${esc(BR[o.branch] || '')}</div>
    ${o.status === 'cancelled' ? `<div class="note" style="border-color:rgba(255,90,78,.4)">✖️ ${o.cancelledBy === 'customer' ? 'Mijoz bekor qildi' : 'Rad etildi'}${o.cancelReason ? ': ' + esc(o.cancelReason) : ''}</div>` : ''}
    <div class="who"><b>${esc(o.name)}</b><span class="tel">${esc(o.phone)}</span></div>
    <div style="font-size:13px">📍 ${esc(o.addr || '—')}${o.dist != null ? ` · ${o.dist} km` : ''} ${o.lat != null ? `· <a href="${U.navLink({ lat: o.lat, lng: o.lng })}" target="_blank" rel="noopener">xaritada</a>` : ''}</div>
    ${o.note ? `<div class="note">💬 ${esc(o.note)}</div>` : ''}
    ${o.courier ? `<div class="cour">🛵 <b>${esc(o.courier.name)}</b> <span class="tel">${esc(o.courier.phone || '')}</span> ${gps}</div>` : gps}
    ${o.rating ? `<div><span class="stars">${'★'.repeat(o.rating.stars)}${'☆'.repeat(5 - o.rating.stars)}</span>${o.rating.comment ? ` <span class="hint">“${esc(o.rating.comment)}”</span>` : ''}</div>` : ''}
    <div class="items2">${o.items.map(i => { const x = itemInfo(i); return `<div class="it">${x.img ? `<img src="img/${esc(x.pid)}.webp" alt="" loading="lazy">` : '<span class="noimg"></span>'}<div class="m"><b>${esc(x.name)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</div><span class="q">×${i.q}</span><span class="pr">${U.money(i.price * i.q)}</span></div>`; }).join('')}
      <div class="sum">${o.del ? `<div><span>Yetkazish</span><span>${U.money(o.del)}</span></div>` : ''}${o.disc ? `<div><span>Chegirma ${esc(o.promo || '')}</span><span>−${U.money(o.disc)}</span></div>` : ''}
      <div class="tot"><span>Jami</span><span>${U.money(o.total)} so'm</span></div></div></div>
    ${actions(o)}</article>`;
}

const visible = () => Object.values(ORD).filter(o => branchF === '' || o.branch === +branchF);
function draw() {
  if (!$('#board')) return;
  const list = visible().sort((a, b) => b.createdAt - a.createdAt);
  const done = Date.now() - 12 * 3600e3;
  const keep = {}; document.querySelectorAll('.cform select, .cform input').forEach(el => { if (el.id) keep[el.id] = el.value; });
  const cols = COLS.map(([cls, title, f]) => {
    let items = list.filter(f);
    if (cls === 'c-done') items = items.filter(o => (o.history.delivered || o.history.cancelled || 0) > done).slice(0, 30);
    if (cls === 'c-new') items.reverse();
    return { cls, title, items };
  });
  const mob = isMob();
  if (!COLS.some(c => c[0] === colSel)) colSel = 'c-new';
  $('#stabs').innerHTML = mob ? cols.map(c => `<button data-col="${c.cls}" class="${c.cls === colSel ? 'on' : ''} ${c.cls === 'c-new' && c.items.length ? 'hot' : ''}">${c.title}<span>${c.items.length}</span></button>`).join('') : '';
  $('#board').classList.toggle('mob', mob);
  $('#board').innerHTML = cols.filter(c => !mob || c.cls === colSel).map(c => `<div class="col ${c.cls}">${mob ? '' : `<h3>${c.title}<span class="n">${c.items.length}</span></h3>`}${c.items.map(card).join('') || '<div class="empty">Bo\'sh</div>'}</div>`).join('');
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if (el) { el.value = v; if (el.tagName === 'SELECT') el.dispatchEvent(new Event('change')); } });
  const act = list.filter(o => !['delivered', 'cancelled'].includes(o.status));
  $('#stats').textContent = `Faol: ${act.length}`;
  const nNew = list.filter(o => o.status === 'new').length;
  const nb = $('#newN'); if (nb) { nb.hidden = !nNew; nb.textContent = nNew; }
  document.title = (nNew ? `(${nNew}) ` : '') + 'Uzbegim Oshxona';
  drawMap();
}
document.addEventListener('change', e => {
  const s = e.target.closest('[id^="cs-"]'); if (!s) return;
  const id = s.id.slice(3), man = s.value === 'manual';
  ['cn-', 'cp-'].forEach(p => { const el = document.getElementById(p + id); if (el) el.hidden = !man; });
});

function drawMap() {
  if (!map || !window.L) return;
  const Lf = window.L, seen = new Set();
  visible().filter(o => o.status === 'onway').forEach(o => {
    if (o.loc) {
      seen.add('c' + o.id);
      if (!mk['c' + o.id]) mk['c' + o.id] = Lf.marker([o.loc.lat, o.loc.lng], { icon: U.pin(Lf, '🛵', 'pulse'), zIndexOffset: 1000 }).addTo(map);
      mk['c' + o.id].setLatLng([o.loc.lat, o.loc.lng]).bindTooltip(`#${o.no} ${o.courier ? o.courier.name : ''}`);
    }
    if (o.lat != null) { seen.add('h' + o.id); if (!mk['h' + o.id]) mk['h' + o.id] = Lf.marker([o.lat, o.lng], { icon: U.pin(Lf, '🏠', 'home') }).addTo(map).bindTooltip(`#${o.no} ${o.name}`); }
  });
  Object.keys(mk).forEach(k => { if (!seen.has(k)) { map.removeLayer(mk[k]); delete mk[k]; } });
}

    <div class="rc-sum">${L('Mahsulotlar (' + n + ' ta)', U.money(o.sub || o.items.reduce((a, i) => a + i.price * i.q, 0)))}${o.del ? L('Yetkazish' + (o.dist != null ? ' · ' + o.dist + ' km' : ''), U.money(o.del)) : ''}${o.disc ? L('Chegirma' + (o.promo ? ' (' + esc(o.promo) + ')' : ''), '−' + U.money(o.disc)) : ''}${L('JAMI', U.money(o.total) + " so'm", 'tot')}</div>

      <select class="fld" id="sRole"><option value="courier" ${s?.role === 'courier' ? 'selected' : ''}>Kuryer</option><option value="admin" ${s?.role === 'admin' ? 'selected' : ''}>Oshxona xodimi</option></select>
      <select class="fld" id="sBranch"><option value="">Barcha filiallar</option>${BR.map((n, i) => `<option value="${i}" ${s?.branch === i ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <input class="fld" id="sPin" type="password" inputmode="numeric" placeholder="${s ? 'Yangi PIN (o\'zgartirmasangiz bo\'sh qoldiring)' : 'PIN (kamida 6 raqam)'}">
      ${s ? `<label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="sActive" ${s.active ? 'checked' : ''}> Faol (o'chirsangiz kira olmaydi)</label>` : ''}
      <div class="err" id="sErr"></div>
      <div style="display:flex;gap:8px"><button class="btn">${s ? 'Saqlash' : 'Qo\'shish'}</button>${s ? '<button type="button" class="btn ghost" id="sCancel">Bekor</button>' : ''}</div>
      <p class="hint">Xodim telefoni va PIN bilan kiradi: oshxona xodimi — admin.html, kuryer — courier.html. Filial tanlansa, faqat o'sha filial buyurtmalarini ko'radi.</p>
    </form>
    <div class="glass" style="padding:18px"><h2 style="font-size:17px;margin-bottom:8px">Xodimlar (${STAFF.length})</h2><div class="tw"><table><tr><th>Ism</th><th>Telefon</th><th>Lavozim</th><th>Filial</th><th></th></tr>
      ${STAFF.map(x => `<tr style="${x.active ? '' : 'opacity:.5'}"><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${x.role === 'admin' ? 'Oshxona' : 'Kuryer'}</td><td>${x.branch == null ? 'Barchasi' : esc(BR[x.branch])}</td><td><button class="btn ghost" style="height:34px" data-edit="${x.id}">Tahrir</button></td></tr>`).join('') || '<tr><td colspan="5" class="hint">Hali xodim yo\'q. Chapdan qo\'shing.</td></tr>'}
    </table></div></div></div>`;
  $('#sf').onsubmit = async e => {
    e.preventDefault();
    try {
      await api('staff/save', { body: { id: s?.id, name: $('#sName').value, phone: $('#sPhone').value, role: $('#sRole').value, branch: $('#sBranch').value, pin: $('#sPin').value.trim() || undefined, active: s ? $('#sActive').checked : true } });
      toast('Saqlandi'); staffView();
    } catch (x) { $('#sErr').textContent = errMsg(x); }
  };
  if (s) $('#sCancel').onclick = () => staffView();
}

document.addEventListener('click', async e => {
  const sn = e.target.closest('[data-seen]'); if (sn) { await api('staff/apps', { body: { id: sn.dataset.seen, seen: !!sn.dataset.v2 } }).catch(() => {}); return appsView(); }
  const bn = e.target.closest('[data-brnew]'); if (bn) return branchView();
  const be = e.target.closest('[data-bredit]'); if (be) return branchView(+be.dataset.bredit);
  const pr = e.target.closest('[data-print]'); if (pr) return printOrder(ORD[pr.dataset.print]);
  const ed = e.target.closest('[data-edit]'); if (ed) return staffView(ed.dataset.edit);
  const dd = e.target.closest('[data-days]'); if (dd) return stats(+dd.dataset.days);
  const sp = e.target.closest('[data-stop]');
  if (sp) { const id = sp.dataset.stop; try { const r = await api('staff/stop', { body: { id, stop: !STOP.has(id) } }); STOP = new Set(r.stop); menuView(); } catch (x) { toast(errMsg(x)); } return; }
  const b = e.target.closest('[data-st]');
  if (!b) return;
  const id = b.dataset.id, st = b.dataset.st, body = { status: st };
  if (st === 'cancelled') {
    const box = document.getElementById('rj-' + id);
    if (box.hidden) { box.hidden = false; b.textContent = 'Rad etishni tasdiqlash'; return; }
    body.reason = [document.getElementById('rr-' + id).value, document.getElementById('rt-' + id).value.trim()].filter(Boolean).join('. ');
  }
  if (st === 'onway') {
    const sel = document.getElementById('cs-' + id).value;
    if (!sel) return toast('Kuryerni tanlang');
    if (sel === 'manual') { const n = document.getElementById('cn-' + id).value.trim(); if (!n) return toast('Kuryer ismini yozing'); body.courier = { name: n, phone: document.getElementById('cp-' + id).value.trim() }; }
    else body.courier = { id: sel };
  }
  b.disabled = true;
  try { await api(`orders/${id}/status`, { body }); }
  catch (x) { b.disabled = false; toast(errMsg(x)); }
});
setInterval(() => Object.keys(ORD).length && view === 'board' && draw(), 30000);
TOK ? api('staff/me').then(s => { if (s.role !== 'admin') throw new Error(); ME = s; start(); }).catch(() => { ss.set('uzb_staff', ''); loginView(); }) : loginView();
</script>
</body>
</html>
