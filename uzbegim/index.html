<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uzbegim — Fast food yetkazib berish</title>
<meta name="description" content="Uzbegim — burger, lavash, shaurma, hot-dog va pitsa. Tez, issiq va mazali yetkazib berish.">
<meta name="theme-color" content="#0f0c0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ff7a00'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' font-family='Arial Black' fill='%23120d09'%3EU%3C/text%3E%3C/svg%3E">
<style>
:root{
  --or:#ff7a00; --or2:#ffa62b; --or-d:#c75200; --red:#ff3b30;
  --bg:#0f0c0a; --bg2:#17120e; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --ln:rgba(255,255,255,.10); --ink:#fbf3ea; --mut:#a99c90; --pic:rgba(255,140,40,.10);
  --shadow:0 20px 50px rgba(0,0,0,.45); --r:24px;
  --grad:linear-gradient(135deg,#ffa62b,#ff6a00);
}
:root[data-theme="light"]{
  --bg:#fff7ef; --bg2:#ffeedd; --glass:rgba(255,255,255,.75); --glass2:#fff;
  --ln:rgba(120,60,10,.12); --ink:#1d140d; --mut:#7d6a5b; --pic:rgba(255,140,40,.12);
  --shadow:0 16px 40px rgba(150,70,10,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow-x:hidden;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 400px at 85% 5%,rgba(255,122,0,.22),transparent 70%),radial-gradient(500px 500px at 0% 60%,rgba(255,90,0,.12),transparent 70%),radial-gradient(500px 300px at 60% 100%,rgba(255,166,43,.10),transparent 70%)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.02em}
.acc{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.glass{background:var(--glass);border:1px solid var(--ln);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}

/* header */
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--ln)}
.hdr{display:flex;align-items:center;gap:14px;height:76px}
.logo{display:flex;align-items:center;gap:6px;font-family:Unbounded;font-weight:900;font-size:21px;background:#000;border:1px solid var(--ln);padding:6px 6px 6px 14px;border-radius:999px;color:var(--or2);flex:none}
:root[data-theme="light"] .logo{background:#1d140d}
.logo b{background:var(--grad);color:#120d09;border-radius:999px;padding:4px 10px}
nav.main{display:flex;gap:2px;margin-left:6px}
nav.main a{white-space:nowrap;padding:8px 12px;border-radius:999px;font-weight:700;font-size:15px;opacity:.85;transition:.2s}
nav.main a:hover,nav.main a.on{opacity:1;background:var(--glass2);color:var(--or2)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}
.otype{height:46px;padding:0 20px;border-radius:999px;background:var(--grad);color:#120d09;font-weight:800;white-space:nowrap;box-shadow:0 8px 24px rgba(255,122,0,.35)}
.ph{line-height:1.15;white-space:nowrap}
.ph b{font-family:Unbounded;font-size:16px;display:block}
.ph span{font-size:11px;color:var(--mut)}
.icons{display:flex;gap:2px}
.ic{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;position:relative;transition:.2s}
.ic:hover{background:var(--glass2);color:var(--or2)}
.ic svg{width:22px;height:22px}
.ic .cnt{position:absolute;top:2px;right:0;background:var(--or);color:#120d09;border-radius:999px;min-width:18px;height:18px;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.ic .cnt:empty,.ic .cnt[data-z]{display:none}
.ic.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.25) rotate(-8deg)}60%{transform:scale(.9)}}
.ic .lg{font-size:11px;font-weight:800;position:absolute;bottom:3px;right:2px}
.sbar{max-height:0;overflow:hidden;transition:max-height .3s}
.sbar.on{max-height:80px}
.sbar .wrap{padding-bottom:14px;position:relative}
.sbar input{width:100%;height:50px;border-radius:999px;border:1px solid var(--ln);background:var(--glass);padding:0 20px 0 48px;outline:none}
.sbar input:focus{border-color:var(--or)}
.sbar svg{position:absolute;left:34px;top:15px;width:20px;opacity:.6}
.menuBtn{display:none}

/* hero */
.hero{margin-top:22px;display:grid;grid-template-columns:1.65fr 1fr;gap:18px}
.slider{position:relative;border-radius:32px;overflow:hidden;min-height:430px;border:1px solid var(--ln)}
.slide{position:absolute;inset:0;display:flex;align-items:center;padding:40px 48px 60px;color:#fff;opacity:0;transition:opacity .7s,transform .7s;transform:scale(1.03)}
.slide.on{opacity:1;transform:none;z-index:1}
.slide .txt{max-width:58%;position:relative;z-index:2}
.slide .tag{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);font-weight:700;padding:6px 14px;border-radius:999px;font-size:13px;margin-bottom:18px}
.slide h1{font-size:clamp(24px,2.9vw,38px);line-height:1.05;font-weight:900}
.slide .huge{font-family:Unbounded;font-weight:900;font-size:clamp(64px,8vw,112px);line-height:.9;display:block;margin:4px 0}
.slide p{margin:12px 0 22px;opacity:.85;font-size:16px;max-width:400px}
.slide .big{position:absolute;right:-10px;bottom:-30px;font-size:min(260px,28vw);line-height:1;filter:drop-shadow(0 30px 40px rgba(255,110,0,.45));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:46px;height:46px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px);color:#fff;font-size:20px}
.arr.l{left:14px}.arr.r{right:14px}
.dots{position:absolute;left:48px;bottom:24px;display:flex;gap:8px;z-index:3}
.dots button{width:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.35);transition:width .3s}
.dots button.on{width:34px;background:var(--or2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;font-weight:800;background:var(--grad);color:#120d09;box-shadow:0 10px 26px rgba(255,122,0,.35);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:none;border:1px solid var(--ln)}
.side{display:grid;gap:18px;grid-template-rows:1fr 1fr}
.tile{border-radius:32px;padding:26px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:190px}
.tile h3{font-size:21px;line-height:1.15}
.tile p{color:var(--mut);font-size:14px;margin-top:6px}
.tile .em{position:absolute;right:16px;top:8px;font-size:92px;transform:rotate(12deg);filter:drop-shadow(0 16px 20px rgba(255,110,0,.35))}
.tile .k{font-family:Unbounded;font-size:44px;font-weight:900}

/* categories: tabs + sliding indicator */
.cats{position:sticky;top:76px;z-index:40;margin-top:34px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:6px}
.cats .all{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.cats .all:hover{background:var(--glass2);color:var(--or2)}
.cats .all svg{width:22px}
.cats .row{position:relative;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;scroll-behavior:smooth}
.cats .row::-webkit-scrollbar{display:none}
.cat{flex:none;padding:18px 14px 16px;font-weight:700;font-size:15px;color:var(--mut);transition:color .25s;white-space:nowrap;display:flex;gap:6px;align-items:center}
.cat i{font-style:normal;font-size:17px;filter:grayscale(1);opacity:.6;transition:.25s}
.cat:hover{color:var(--ink)}
.cat.on{color:var(--ink)}
.cat.on i{filter:none;opacity:1;transform:scale(1.15)}
.ind{position:absolute;bottom:0;left:0;height:3px;border-radius:3px 3px 0 0;background:var(--grad);box-shadow:0 0 12px rgba(255,122,0,.7);transition:transform .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.catGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.catGrid button{padding:16px 8px;border-radius:18px;border:1px solid var(--ln);background:var(--glass);font-weight:700;font-size:13px;display:grid;gap:6px;justify-items:center}
.catGrid button i{font-style:normal;font-size:30px}
.catGrid button.on{border-color:var(--or);color:var(--or2)}
.toTop{position:fixed;left:20px;bottom:24px;z-index:55;width:56px;height:56px;border-radius:99px;background:var(--grad);color:#120d09;font-size:24px;font-weight:900;box-shadow:0 10px 26px rgba(255,122,0,.45);transform:scale(0);transition:transform .3s}
.toTop.on{transform:scale(1)}

/* menu */
section.sec{margin-top:34px;scroll-margin-top:150px}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sec h2{font-size:clamp(22px,3vw,30px);display:flex;align-items:center;gap:12px}
.sec h2 .pill{font-family:Manrope;font-size:13px;font-weight:800;background:var(--glass2);color:var(--or2);padding:4px 10px;border-radius:999px;border:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.card{border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:rgba(255,140,40,.4)}
.card .pic{aspect-ratio:1/1;display:grid;place-items:center;font-size:110px;position:relative;cursor:pointer;background:radial-gradient(circle at 50% 58%,rgba(255,140,40,.26),transparent 62%)}
.card .pic span{transition:transform .35s;filter:drop-shadow(0 18px 18px rgba(0,0,0,.4))}
.card:hover .pic span{transform:scale(1.1) rotate(-6deg)}
.badge{position:absolute;left:12px;top:12px;font-size:11px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--red);color:#fff}
.badge.new{background:#14b8a6}
.badge.hit{background:var(--grad);color:#120d09}
.fav{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:99px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:16px;color:#fff;z-index:2;transition:transform .2s}
.fav:active{transform:scale(1.3)}
.ctl{position:absolute;right:12px;bottom:12px;z-index:2}
.add{width:50px;height:50px;border-radius:99px;background:var(--glass2);border:1px solid var(--ln);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .2s,background .2s,color .2s}
.add svg{width:22px;height:22px}
.card:hover .add,.add:hover{background:var(--grad);color:#120d09;border-color:transparent;transform:rotate(90deg)}
.qty{display:flex;align-items:center;background:var(--grad);color:#120d09;border-radius:999px;height:50px;padding:0 4px;box-shadow:0 8px 20px rgba(255,122,0,.4)}
.qty button{width:40px;height:100%;font-size:22px;font-weight:900}
.qty b{min-width:20px;text-align:center;font-size:16px}
.card .body{padding:12px 16px 18px;display:flex;flex-direction:column;flex:1}
.price{font-family:Unbounded;font-weight:700;font-size:22px;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price small{font-family:Manrope;font-size:13px;color:var(--mut);font-weight:600}
.price s{font-family:Manrope;font-size:13px;color:var(--red);font-weight:600}
.card h3{font-family:Manrope;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em;margin-top:4px}
.meta{display:flex;gap:10px;font-size:13px;color:var(--mut);margin-top:4px}
.meta b{color:var(--or2)}
.empty{padding:40px;text-align:center;color:var(--mut)}

/* about */
.about{margin-top:70px;display:grid;grid-template-columns:1.1fr 1fr;gap:18px;scroll-margin-top:100px}
.ab{border-radius:32px;padding:38px}
.ab h2{font-size:clamp(24px,3vw,36px);margin-bottom:14px}
.ab p{color:var(--mut);margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{border-radius:24px;padding:22px}
.stat b{font-family:Unbounded;font-size:30px;display:block}
.stat span{color:var(--mut);font-size:14px}
.vals{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.vals span{padding:8px 14px;border-radius:999px;background:var(--glass2);border:1px solid var(--ln);font-weight:700;font-size:13px}

/* promos */
.promos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pr{border-radius:28px;padding:26px;position:relative;overflow:hidden;min-height:220px;display:flex;flex-direction:column}
.pr .em{position:absolute;right:-6px;bottom:-14px;font-size:110px;opacity:.95;filter:drop-shadow(0 16px 20px rgba(255,110,0,.35))}
.pr .k{font-family:Unbounded;font-weight:900;font-size:40px;line-height:1}
.pr h3{font-family:Manrope;font-weight:800;font-size:18px;margin:10px 0 6px;max-width:70%}
.pr p{color:var(--mut);font-size:14px;max-width:65%;flex:1}
.code{margin-top:14px;align-self:flex-start;display:inline-flex;gap:8px;align-items:center;border:1.5px dashed var(--or);color:var(--or2);padding:8px 14px;border-radius:12px;font-family:Unbounded;font-size:13px;font-weight:700}

/* vacancies */
.vacs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.vac{border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:6px}
.vac .e{font-size:40px}
.vac h3{font-family:Manrope;font-weight:800;font-size:18px}
.vac .sal{font-family:Unbounded;font-size:15px;color:var(--or2)}
.vac p{color:var(--mut);font-size:13px;flex:1}
.vac .btn{height:44px;margin-top:10px;font-size:14px}

/* contacts */
.contact{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
.cinfo{border-radius:28px;padding:30px;display:grid;gap:16px;align-content:start}
.crow{display:flex;gap:14px;align-items:center}
.crow i{font-style:normal;width:48px;height:48px;border-radius:16px;background:var(--glass2);border:1px solid var(--ln);display:grid;place-items:center;font-size:22px;flex:none}
.crow b{display:block}.crow span{color:var(--mut);font-size:14px}
.blist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.br{border-radius:22px;padding:18px}
.br h3{font-family:Manrope;font-weight:800;font-size:16px}
.br p{color:var(--mut);font-size:13px;margin:4px 0}
.open{font-size:12px;font-weight:800;color:#34d399}

footer{margin-top:80px;border-top:1px solid var(--ln);padding:44px 0 110px;background:rgba(0,0,0,.25)}
:root[data-theme="light"] footer{background:rgba(255,255,255,.5)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
footer h4{font-family:Unbounded;margin-bottom:12px;font-size:15px}
footer a{display:block;color:var(--mut);padding:3px 0;font-size:14px}
footer a:hover{color:var(--or2)}
.soc{display:flex;gap:8px;margin-top:14px}
.soc a{width:42px;height:42px;border-radius:14px;background:var(--glass2);border:1px solid var(--ln);display:grid;place-items:center;color:var(--ink)}
.copy{border-top:1px solid var(--ln);margin-top:30px;padding-top:20px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* drawer & modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(4px)}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg2);border-left:1px solid var(--ln);z-index:100;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--ln)}
.dh h3{font-size:20px}
.x{width:42px;height:42px;border-radius:99px;background:var(--glass2);border:1px solid var(--ln);font-size:18px}
.db{flex:1;overflow-y:auto;padding:16px 20px}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--ln)}
.ci .e{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;font-size:34px;flex:none;background:var(--pic)}
.ci .m{flex:1;min-width:0}
.ci .m b{display:block;font-size:14px}
.ci .m span{font-size:13px;color:var(--mut)}
.df{padding:18px 20px;border-top:1px solid var(--ln)}
.line{display:flex;justify-content:space-between;font-size:14px;margin:4px 0;color:var(--mut)}
.line.tot{color:var(--ink);font-weight:800;font-size:18px;margin-top:10px}
.promo{display:flex;gap:8px;margin:12px 0}
.promo input{flex:1;height:46px;border-radius:14px;border:1px solid var(--ln);background:var(--glass);padding:0 14px;outline:none;text-transform:uppercase}
.promo button{padding:0 16px;border-radius:14px;background:var(--glass2);border:1px solid var(--ln);font-weight:800}
.wide{width:100%}
.prog{height:8px;border-radius:99px;background:var(--glass2);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--grad);transition:width .4s}
.hint{font-size:12px;color:var(--mut)}
.modal{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:16px;pointer-events:none;opacity:0;transition:.25s}
.modal.on{opacity:1;pointer-events:auto}
.mbox{background:var(--bg2);border:1px solid var(--ln);border-radius:30px;width:min(500px,100%);max-height:92vh;overflow-y:auto;position:relative;transform:translateY(20px) scale(.97);transition:.3s;box-shadow:var(--shadow)}
.modal.on .mbox{transform:none}
.mbox>.x{position:absolute;right:14px;top:14px;z-index:2}
.mpic{aspect-ratio:16/10;display:grid;place-items:center;font-size:150px;background:radial-gradient(circle at 50% 60%,rgba(255,140,40,.35),transparent 65%)}
.mbody{padding:24px}
.mbody h3{font-size:23px}
.form{display:grid;gap:10px;margin-top:16px}
.form input,.form textarea,.form select{height:50px;border-radius:16px;border:1px solid var(--ln);background:var(--glass);padding:0 16px;outline:none}
.form select option{background:var(--bg2)}
.form textarea{height:84px;padding:12px 16px;resize:none}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--or)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--glass);border:1px solid var(--ln);border-radius:16px;padding:4px;gap:4px}
.seg button{height:44px;border-radius:12px;font-weight:800;font-size:14px}
.seg button.on{background:var(--grad);color:#120d09}
.types{display:grid;gap:10px;margin-top:16px}
.type{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;border:1px solid var(--ln);background:var(--glass);text-align:left;transition:.2s}
.type i{font-style:normal;font-size:34px}
.type b{display:block;font-size:16px}.type span{color:var(--mut);font-size:13px}
.type.on{border-color:var(--or);background:rgba(255,122,0,.12)}
.track{margin:18px 0;text-align:left}
.ts{display:flex;gap:12px;align-items:center;opacity:.3;transition:.4s}
.ts.on{opacity:1}
.ts .d{width:42px;height:42px;border-radius:99px;background:var(--glass2);border:1px solid var(--ln);display:grid;place-items:center;font-size:18px;flex:none}
.ts.on .d{background:var(--grad);border-color:transparent}
.ts .bar{width:2px;height:20px;background:var(--ln);margin-left:20px}
.ts.cur .d{animation:pulse 1.2s infinite}

.eta{font-family:Unbounded;font-size:34px;color:var(--or2)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;z-index:200;transition:.35s;box-shadow:var(--shadow);font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0)}
.fly{position:fixed;z-index:300;font-size:40px;pointer-events:none;transition:all .7s cubic-bezier(.5,-.3,.7,1)}
.confetti{position:fixed;width:10px;height:14px;z-index:300;pointer-events:none;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.tabs{display:none}
.mnav{display:none}

@media (max-width:1240px){.ph{display:none}}
@media (max-width:1000px){
  nav.main{display:none}

}

/* scroll-spy: faol bo'lim tugmasi belgilanadi */
let curCat=null;
const catsBottom=()=>$(".cats")?.getBoundingClientRect().height+$("header").getBoundingClientRect().height;
function moveInd(){
  const ind=$("#ind"),b=document.querySelector(`.cat[data-cat="${curCat}"]`);
  if(!ind)return;
  if(!b){ind.style.width="0px";return}
  ind.style.width=b.offsetWidth-16+"px";ind.style.transform=`translateX(${b.offsetLeft+8}px)`;
}
function spy(){
  const top=catsBottom()+60;
  let cur=null;
  document.querySelectorAll("#sections .sec").forEach(s=>{if(s.getBoundingClientRect().top<top)cur=s.id.slice(4)});
  if(cur==="fav")cur=null;
  const last=[...document.querySelectorAll("#sections .sec")].pop();
  if(last&&last.getBoundingClientRect().bottom<top)cur=null;
  if(cur!==curCat){
    curCat=cur;
    document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("on",b.dataset.cat===cur));
    const b=document.querySelector(`.cat[data-cat="${cur}"]`),row=$("#cats");
    if(b)row.scrollLeft=b.offsetLeft-row.clientWidth/2+b.offsetWidth/2;
    moveInd();
  }
  $("#toTop").classList.toggle("on",scrollY>900);
  let nav=null;["menu","about","promos","vacancies","contacts"].forEach(id=>{const el=document.getElementById(id);if(el&&el.getBoundingClientRect().top<200)nav=id});
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+nav));
}
addEventListener("resize",moveInd);

function totals(){
  const sub=Object.entries(cart).reduce((a,[id,q])=>a+byId[id].price*q,0);
  let disc=0,del=(mode==="p"||sub>=FREE_FROM||!sub)?0:DELIVERY;
  if(promo&&PROMOS[promo]){const pr=PROMOS[promo];if(pr.t==="pct")disc=Math.round(sub*pr.v/1000)*100;if(pr.t==="fix")disc=Math.min(pr.v,sub);if(pr.t==="del")del=0}
  return{sub,disc,del,tot:Math.max(0,sub-disc+del),n:Object.values(cart).reduce((a,q)=>a+q,0)};
}
const save=()=>{store.set("cart",cart);store.set("promo",promo);store.set("favs",favs);store.set("mode",mode)};
function change(id,d,el){
  cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save();
  if(d>0&&el){flyTo(el,byId[id].e);if(cart[id]===1)toast(`${byId[id].e} ${byId[id].n[L]} ${t("added")}`)}
  document.querySelectorAll(`.card[data-id="${id}"] .ctl`).forEach(f=>{const tmp=document.createElement("div");tmp.innerHTML=ctlHTML(byId[id]);f.replaceWith(tmp.firstChild)});
  renderCart();
}
function renderCart(){
  const s=totals();
  for(const el of [$("#cnt"),$("#tcnt")]){el.textContent=s.n;s.n?el.removeAttribute("data-z"):el.setAttribute("data-z","")}
  $("#dTitle").textContent=t("cart");
  const ids=Object.keys(cart);
  if(!ids.length){
    $("#cartList").innerHTML=`<div class="empty" style="padding-top:70px"><div style="font-size:84px">🛍️</div><h3 style="margin:10px 0 4px">${t("cartEmpty")}</h3><p>${t("cartEmptyP")}</p><br><button class="btn" data-close data-gomenu>${t("goMenu")}</button></div>`;
    $("#cartFoot").innerHTML="";return;
  }
  $("#cartList").innerHTML=`<div class="seg" style="margin-bottom:8px"><button class="${mode==="d"?"on":""}" data-mode="d">${t("oDel")}</button><button class="${mode==="p"?"on":""}" data-mode="p">${t("oPick")}</button></div>`+
    ids.map(id=>{const p=byId[id];return `<div class="ci"><div class="e">${p.e}</div><div class="m"><b>${p.n[L]}</b><span>${fmt(p.price)}</span></div><div class="qty"><button data-dec="${id}">−</button><b>${cart[id]}</b><button data-inc="${id}">+</button></div></div>`}).join("");
  const left=FREE_FROM-s.sub;
  $("#cartFoot").innerHTML=`
    ${mode==="d"?`<div class="hint">${left>0?`${t("freeLeft")} <b>${fmt(left)}</b>`:t("freeOk")}</div><div class="prog"><i style="width:${Math.min(100,s.sub/FREE_FROM*100)}%"></i></div>`:""}
    <div class="promo"><input id="promoIn" placeholder="${t("promoPh")}" value="${promo||""}"><button id="promoBtn">${t("applyP")}</button></div>
    <div class="line"><span>${t("sub")}</span><span>${fmt(s.sub)}</span></div>
    ${s.disc?`<div class="line" style="color:#34d399"><span>${t("disc")} (${promo})</span><span>−${fmt(s.disc)}</span></div>`:""}
    ${mode==="d"?`<div class="line"><span>${t("del")}</span><span>${s.del?fmt(s.del):t("free")}</span></div>`:""}
    <div class="line tot"><span>${t("total")}</span><span>${fmt(s.tot)}</span></div>
    <button class="btn wide" id="checkout" style="margin-top:12px">${t("checkout")} • ${fmt(s.tot)}</button>`;
  $("#promoBtn").onclick=()=>applyPromo($("#promoIn").value);
  $("#checkout").onclick=openCheckout;
}

function closeAll(){["#drawer","#ov","#modal"].forEach(s=>$(s).classList.remove("on"))}

/* ===== Modallar ===== */
function openProduct(id){
  const p=byId[id];
  openModal(`<div class="mpic"><span style="filter:drop-shadow(0 20px 26px rgba(0,0,0,.45))">${p.e}</span></div>
    <div class="mbody"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><h3>${p.n[L]}</h3><span class="price" style="font-size:22px">${fmt(p.price)}</span></div>
    <div class="rt" style="margin-top:6px"><b>★ ${p.rate}</b> (${p.votes})</div>
    <p style="color:var(--mut);margin:10px 0 20px">${p.d[L]}</p>
    <button class="btn wide" data-add="${p.id}" data-close>${t("add")} • ${fmt(p.price)}</button></div>`);
}
function openType(){
  const draw=()=>openModal(`<div class="mbody" style="padding-top:30px"><h3>${t("oChoose")}</h3><div class="types">
    <button class="type ${mode==="d"?"on":""}" data-mode="d" data-close><i>🛵</i><div><b>${t("oDel").slice(2)}</b><span>${t("oDelP")}</span></div></button>
    <button class="type ${mode==="p"?"on":""}" data-mode="p" data-close><i>🏃</i><div><b>${t("oPick").slice(2)}</b><span>${t("oPickP")}</span></div></button></div></div>`);
  draw();
}
function setMode(m){mode=m;save();renderText();renderCart()}
const phoneOk=v=>v.replace(/\D/g,"").length>=12;
function openCheckout(){
  const s=totals();
  $("#drawer").classList.remove("on");
  openModal(`<div class="mbody" style="padding-top:30px"><h3>${t("ordH")}</h3><div class="form">
    <div class="seg"><button class="${mode==="d"?"on":""}" data-mode="d" data-reco>${t("oDel")}</button><button class="${mode==="p"?"on":""}" data-mode="p" data-reco>${t("oPick")}</button></div>
    <input id="fName" placeholder="${t("name")}" autocomplete="name">
    <input id="fPhone" type="tel" value="+998 " autocomplete="tel">
    ${mode==="d"?`<input id="fAddr" placeholder="${t("addr")}" autocomplete="street-address">`:`<select id="fAddr">${BRANCHES.map(b=>`<option>${b[L][0]} — ${b[L][1]}</option>`).join("")}</select>`}
    <textarea id="fNote" placeholder="${t("note")}"></textarea>
    <div class="hint">💳 ${t("pay")}</div>
    <div class="line tot"><span>${t("total")}</span><span>${fmt(s.tot)}</span></div>
    <button class="btn wide" id="fGo">${t("confirm")} ✓</button></div></div>`);
  $("#fGo").onclick=()=>{
    if(!$("#fName").value.trim()||!phoneOk($("#fPhone").value)||!$("#fAddr").value.trim()){toast(t("fill"));return}
    cart={};promo=null;save();renderMenu();renderCart();showTracker();
  };
}
function showTracker(){
  const no="UZ-"+Math.floor(10000+Math.random()*89999);
  const steps=mode==="d"?[["✅","tr1"],["👨‍🍳","tr2"],["🛵","tr3"],["🎉","tr4"]]:[["✅","tr1"],["👨‍🍳","tr2"],["🛍️","trP"]];
  let eta=mode==="d"?30:15;
  openModal(`<div class="mbody" style="padding-top:34px;text-align:center">
    <div style="font-size:64px">🥳</div><h3>${t("thanks")}</h3><p style="color:var(--mut);margin-top:4px">${t("ordNo")}: <b style="color:var(--ink)">${no}</b></p>
    <p style="color:var(--mut);margin-top:14px">${t("eta")}</p><div class="eta"><span id="eta">${eta}</span> ${t("min")}</div>
    <div class="track">${steps.map((s,i)=>`${i?'<div class="bar"></div>':""}<div class="ts" data-st="${i}"><span class="d">${s[0]}</span><b>${t(s[1])}</b></div>`).join("")}</div>
    <button class="btn wide" data-close>${t("close")}</button></div>`);
  confetti(80);
  steps.forEach((_,i)=>setTimeout(()=>{
    document.querySelectorAll(".ts").forEach(e=>e.classList.remove("cur"));
    const e=document.querySelector(`[data-st="${i}"]`);if(!e)return;e.classList.add("on");if(i<steps.length-1)e.classList.add("cur");
    const el=$("#eta");if(el)el.textContent=Math.max(0,Math.round(eta*(1-i/(steps.length-1))));
  },300+i*1800));
}
function openVac(i){
  const v=t("vacs")[i];
  openModal(`<div class="mbody" style="padding-top:30px"><div style="font-size:48px">${v[0]}</div><h3>${t("vacH")}: ${v[1]}</h3><p style="color:var(--mut);margin-top:6px">${t("vacP")}</p>
    <div class="form"><input id="vName" placeholder="${t("name")}"><input id="vPhone" type="tel" value="+998 "><input id="vAge" type="number" min="16" max="70" placeholder="${t("age")}"><textarea id="vExp" placeholder="${t("exp")}"></textarea>
    <button class="btn wide" id="vGo">${t("send")}</button></div></div>`);
  $("#vGo").onclick=()=>{if(!$("#vName").value.trim()||!phoneOk($("#vPhone").value)){toast(t("fill").split(",")[0]);return}closeAll();toast(t("vacOk"))};
}

/* ===== Effektlar ===== */
let toastT;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),2400)}
function flyTo(el,emoji){
  const target=innerWidth<=640?$("#tCart"):$("#cartBtn");
  const r=el.getBoundingClientRect(),c=target.getBoundingClientRect();
  const f=document.createElement("div");f.className="fly";f.textContent=emoji;f.style.left=r.left+r.width/2-20+"px";f.style.top=r.top-10+"px";document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.left=c.left+c.width/2-20+"px";f.style.top=c.top+"px";f.style.transform="scale(.4)";f.style.opacity=".4"});
  setTimeout(()=>{f.remove();const b=$("#cartBtn");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump")},700);
}
function confetti(n){const cs=["#ff7a00","#ffa62b","#ff3b30","#fff","#ffd166"];for(let i=0;i<n;i++){const d=document.createElement("i");d.className="confetti";d.style.left=Math.random()*100+"vw";d.style.background=cs[i%cs.length];d.style.animationDuration=1.8+Math.random()*1.8+"s";d.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}

/* ===== Hodisalar ===== */
document.addEventListener("click",e=>{
  const g=k=>e.target.closest(`[data-${k}]`);
  let x;
  if(x=g("add"))change(x.dataset.add,1,x.closest(".card")?.querySelector(".pic span")||x);
  else if(x=g("inc"))change(x.dataset.inc,1);
  else if(x=g("dec"))change(x.dataset.dec,-1);
  else if(x=g("open"))openProduct(x.dataset.open);
  else if(x=g("fav")){const id=x.dataset.fav;favs=favs.includes(id)?favs.filter(f=>f!==id):[...favs,id];save();const y=scrollY;renderMenu();scrollTo(0,y)}
  else if(x=g("cat")){const el=document.getElementById("sec-"+x.dataset.cat);if(el){closeAll();scrollTo({top:el.getBoundingClientRect().top+scrollY-catsBottom()-8,behavior:"smooth"})}}
  else if(x=g("mode")){setMode(x.dataset.mode);if(x.dataset.reco!==undefined)openCheckout()}
  else if(x=g("code")){const c=x.dataset.code;navigator.clipboard?.writeText(c).catch(()=>{});promo=c;save();renderCart();toast(`${t("copied")} ${c} ✓`)}
  else if(x=g("vac"))openVac(+x.dataset.vac);
  else if(x=g("sl"))go(sI+ +x.dataset.sl);
  else if(x=g("s"))go(+x.dataset.s);
  const cl=g("close");
  if(cl){closeAll();if(cl.dataset.gomenu!==undefined)document.getElementById("menu").scrollIntoView({behavior:"smooth"})}
  if(e.target.closest("#mnav a"))$("#mnav").classList.remove("on");
});
$("#ov").onclick=closeAll;
$("#modal").onclick=e=>{if(e.target.id==="modal")closeAll()};
addEventListener("keydown",e=>{if(e.key==="Escape")closeAll()});
$("#cartBtn").onclick=openCart;$("#tCart").onclick=openCart;
const goFav=()=>{const s=document.getElementById("sec-fav");if(s)s.scrollIntoView({behavior:"smooth"});else toast(t("noFav"))};
$("#favBtn").onclick=goFav;$("#tFav").onclick=goFav;
$("#otype").onclick=openType;
$("#allCats").onclick=()=>openModal(`<div class="mbody" style="padding-top:30px"><h3>${t("nMenu")}</h3><div class="catGrid">${CATS.map(c=>`<button class="${c.id===curCat?"on":""}" data-cat="${c.id}"><i>${c.e}</i>${c[L]}</button>`).join("")}</div></div>`);
$("#toTop").onclick=()=>scrollTo({top:0,behavior:"smooth"});
$("#theme").onclick=toggleTheme;$("#mTheme").onclick=e=>{e.preventDefault();toggleTheme()};
$("#menuBtn").onclick=()=>$("#mnav").classList.toggle("on");
$("#sBtn").onclick=()=>{const s=$("#sbar");s.classList.toggle("on");if(s.classList.contains("on"))setTimeout(()=>$("#q").focus(),200)};
$("#lang").onclick=()=>{L=L==="uz"?"ru":"uz";store.set("lang",L);renderAll()};
let qT;$("#q").oninput=()=>{clearTimeout(qT);qT=setTimeout(()=>{renderMenu();document.getElementById("menu").scrollIntoView({behavior:"smooth"})},250)};

renderAll();go(0);
</script>
</body>
</html>
