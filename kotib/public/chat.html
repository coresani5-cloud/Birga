<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e47">
  <title>Onlayn yozilish</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="public">
    <header>
      <img src="/logo-256.png" alt="">
      <div><b id="name">…</b><div class="muted small">Onlayn kotib · 24/7</div></div>
    </header>
    <div class="chat" id="chat"></div>
    <div class="quick" id="quick">
      <button class="chip">Bugun bo'sh vaqt bormi?</button>
      <button class="chip">Narxlar qancha?</button>
      <button class="chip">Yozilmoqchiman</button>
      <button class="chip">Записаться на завтра</button>
    </div>
    <form class="chat-form" id="form">
      <button type="button" class="btn" id="mic" title="Ovoz bilan gapirish" style="padding:0 16px">🎤</button>
      <input id="input" placeholder="Xabar yozing yoki 🎤 bosib gapiring…" autocomplete="off">
      <button class="btn primary">➤</button>
    </form>
  </div>
  <script>
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const chat = document.getElementById('chat');
    let sid = localStorage.getItem('kotib_sid');
    if (!sid) { sid = Math.random().toString(36).slice(2, 12); localStorage.setItem('kotib_sid', sid); }
    const add = (who, text) => { chat.insertAdjacentHTML('beforeend', `<div class="msg ${who}">${esc(text).replace(/\n/g, '<br>')}</div>`); chat.scrollTop = 1e9; };
    fetch('/api/public').then((r) => r.json()).then((p) => { document.getElementById('name').textContent = p.name; document.title = p.name + ' — onlayn yozilish'; add('bot', p.greeting); });
    async function send(text) {
      add('me', text);
      chat.insertAdjacentHTML('beforeend', '<div class="msg bot typing">•••</div>'); chat.scrollTop = 1e9;
      try {
        const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session: sid, text }) });
        const j = await r.json();
        chat.querySelector('.typing').remove();
        add('bot', j.reply || j.error || 'Xato');
        if (j.booking) chat.insertAdjacentHTML('beforeend', `<div class="sys">✅ Siz yozildingiz: ${esc(j.booking.date)}, ${esc(j.booking.start)}</div>`);
        if (j.order) chat.insertAdjacentHTML('beforeend', `<div class="sys">🛒 Zakazingiz qabul qilindi</div>`);
      } catch { chat.querySelector('.typing')?.remove(); add('bot', "Aloqa yo'q. Qaytadan urinib ko'ring."); }
      chat.scrollTop = 1e9;
    }
    document.getElementById('form').onsubmit = (e) => { e.preventDefault(); const i = document.getElementById('input'); const t = i.value.trim(); if (t) { i.value = ''; send(t); } };
    document.querySelectorAll('#quick .chip').forEach((c) => c.onclick = () => send(c.textContent));

    // Ovozli suhbat: 🎤 bosing — gapiring — yana bosing. Kotib ovoz bilan javob beradi.
    async function toWav(blob) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = await ctx.decodeAudioData(await blob.arrayBuffer());
      ctx.close && ctx.close();
      const rate = 16000, len = Math.ceil(src.duration * rate);
      const off = new OfflineAudioContext(1, len, rate);
      const n = off.createBufferSource(); n.buffer = src; n.connect(off.destination); n.start();
      const pcm = (await off.startRendering()).getChannelData(0);
      const buf = new ArrayBuffer(44 + pcm.length * 2), dv = new DataView(buf);
      const w = (o, t) => [...t].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF'); dv.setUint32(4, 36 + pcm.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, rate, true);
      dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, pcm.length * 2, true);
      for (let i = 0; i < pcm.length; i++) dv.setInt16(44 + i * 2, Math.max(-1, Math.min(1, pcm[i])) * 0x7fff, true);
      return new Blob([buf], { type: 'audio/wav' });
    }
    const mic = document.getElementById('mic');
    let rec = null, player = new Audio();
    async function sendVoice(blob) {
      chat.insertAdjacentHTML('beforeend', '<div class="msg bot typing">•••</div>'); chat.scrollTop = 1e9;
      try {
        const wav = await toWav(blob);
        const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(wav); });
        const r = await fetch('/api/chat/voice', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session: sid, data: b64, mime: 'audio/wav' }) });
        const j = await r.json();
        chat.querySelector('.typing').remove();
        if (j.error) { add('bot', j.error); return; }
        if (j.text) add('me', '🎤 ' + j.text);
        add('bot', j.reply);
        if (j.booking) chat.insertAdjacentHTML('beforeend', `<div class="sys">✅ Siz yozildingiz: ${esc(j.booking.date)}, ${esc(j.booking.start)}</div>`);
        if (j.audio) { player.src = j.audio; player.play().catch(() => {}); }
        else if (j.lang === 'ru' && window.speechSynthesis) { const u = new SpeechSynthesisUtterance(j.reply); u.lang = 'ru-RU'; speechSynthesis.speak(u); }
      } catch { chat.querySelector('.typing')?.remove(); add('bot', "Ovozni yuborib bo'lmadi. Yozib yuboring."); }
      chat.scrollTop = 1e9;
    }
    mic.onclick = async () => {
      if (rec) { rec.stop(); return; }
      try {
        player.pause();
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        rec = new MediaRecorder(stream);
        rec.ondataavailable = (e) => chunks.push(e.data);
        rec.onstop = () => { stream.getTracks().forEach((t) => t.stop()); rec = null; mic.textContent = '🎤'; mic.classList.remove('primary'); sendVoice(new Blob(chunks, { type: chunks[0]?.type || 'audio/webm' })); };
        rec.start();
        mic.textContent = '⏹'; mic.classList.add('primary');
      } catch { add('bot', 'Mikrofonga ruxsat bering yoki yozib yuboring.'); }
    };
  </script>
</body>
</html>
