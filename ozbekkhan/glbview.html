<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:#888}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script></head><body>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement); r.toneMapping = THREE.ACESFilmicToneMapping;
const s = new THREE.Scene(); s.background = new THREE.Color('#9aa'); s.add(new THREE.HemisphereLight('#fff', '#664', 1.5)); const d = new THREE.DirectionalLight('#fff', 2); d.position.set(2, 3, 4); s.add(d);
const g = await new GLTFLoader().loadAsync(q.get('f') || 'assets/chars/hero.glb'); s.add(g.scene);
const b = new THREE.Box3().setFromObject(g.scene); const sz = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
let n = 0; g.scene.traverse((o) => { if (o.isMesh) { n++; console.log('mesh', o.name, o.geometry.attributes.position.count, Object.keys(o.geometry.attributes).join(','), o.material.type); } });
console.log('size', sz.x.toFixed(3), sz.y.toFixed(3), sz.z.toFixed(3), 'center', c.x.toFixed(3), c.y.toFixed(3), c.z.toFixed(3), 'meshes', n);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 100); const ang = +(q.get('a') || 0) * Math.PI / 180, D = Math.max(sz.x, sz.y, sz.z) * 2.6;
cam.position.set(c.x + Math.sin(ang) * D, c.y, c.z + Math.cos(ang) * D); cam.lookAt(c); r.render(s, cam); window.__ready = true;
</script></body></html>
