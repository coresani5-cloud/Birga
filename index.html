<!-- ============ KIRISH (AUTH) ============ -->
<section id="auth" class="auth hidden">
  <div class="auth-bg"></div>
  <div class="auth-stripes"><i></i><i></i><i></i><i></i></div>
  <div class="lang-switch" id="lang-switch"></div>
  <div class="auth-card">
    <!-- 1-qadam: email -->
    <form id="step-email" class="step" novalidate>
      <img src="/icons/mark.png" class="auth-logo" alt="">
      <h1 class="wordmark">BIRGA</h1>
      <p class="muted" data-i18n="email_intro"></p>
      <div class="email-field">
        <svg><use href="#i-mail"/></svg>
        <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="you@gmail.com" required>
      </div>
      <button class="btn-primary" id="btn-send-code" data-i18n="get_code"></button>
      <p class="tiny muted" data-i18n="terms"></p>
      <button type="button" class="install-btn hidden" data-install><svg><use href="#i-download"/></svg><span data-i18n="install_app"></span></button>
    </form>

    <!-- 2-qadam: emaildagi kod -->
    <form id="step-code" class="step hidden" novalidate>
      <button type="button" class="icon-btn back-step" data-back="email"><svg><use href="#i-back"/></svg></button>
      <div class="sms-anim"><svg><use href="#i-mail"/></svg></div>
      <p class="muted" data-i18n="code_sent_email"></p>
      <h2 id="code-target" class="code-target">you@gmail.com</h2>
      <div class="code-boxes" id="code-boxes">
        <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="1"><input inputmode="numeric" maxlength="1" aria-label="2"><input inputmode="numeric" maxlength="1" aria-label="3"><input inputmode="numeric" maxlength="1" aria-label="4"><input inputmode="numeric" maxlength="1" aria-label="5">
      </div>
      <div id="dev-code" class="dev-code hidden"></div>
      <p class="err" id="code-err"></p>
      <button type="button" class="btn-ghost hidden" id="mail-open"><svg><use href="#i-mail"/></svg><span data-i18n="open_mail"></span></button>
      <p class="tiny muted" data-i18n="check_spam"></p>
      <button type="button" class="link-btn" id="btn-resend" disabled></button>
      <button type="button" class="link-btn" data-back="email" data-i18n="change_email"></button>
    </form>

    <!-- 3-qadam: ro'yxatdan o'tish -->
    <form id="step-profile" class="step hidden" novalidate>
      <h2 data-i18n="your_profile"></h2>
      <p class="muted" data-i18n="profile_hint"></p>
      <label class="avatar-pick">
        <input type="file" accept="image/*" id="reg-avatar" hidden>
        <div class="avatar-xl" id="reg-avatar-preview"><svg><use href="#i-camera"/></svg></div>
      </label>
      <input class="field" id="reg-name" data-i18n-ph="name" maxlength="64" required>
      <div class="field-wrap"><span>@</span><input class="field" id="reg-username" data-i18n-ph="username_opt" maxlength="32" autocapitalize="off"></div>
      <p class="err" id="reg-err"></p>
      <button class="btn-primary" data-i18n="start"></button>
    </form>
  </div>
</section>

<div class="boot hidden" id="boot"><img src="/icons/mark.png" alt=""><div class="spinner"></div><p id="boot-msg"></p></div>

<!-- ============ ASOSIY ILOVA ============ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <!-- CHATLAR -->
    <section class="pane" id="pane-chats">
      <header class="pane-head">
        <div class="brand"><img src="/icons/mark.png" alt=""><span>Birga</span></div>
        <button class="icon-btn" id="btn-new-top"><svg><use href="#i-pen"/></svg></button>
      </header>
      <div class="stories" id="stories"></div>
      <div class="search-row"><div class="search"><svg><use href="#i-search"/></svg><input id="chat-search" data-i18n-ph="search"></div></div>
      <div class="chips" id="filters">
        <button class="chip on" data-f="all" data-i18n="filter_all"></button>
        <button class="chip" data-f="unread"><span data-i18n="filter_unread"></span> <b id="unread-count"></b></button>
      </div>
      <div class="conn-bar hidden" id="conn-bar" data-i18n="connecting"></div>
      <div class="notif-bar hidden" id="notif-bar"><svg><use href="#i-bell"/></svg><span data-i18n="notif_banner"></span><button id="notif-enable" data-i18n="enable"></button><button class="icon-btn" id="notif-close"><svg><use href="#i-close"/></svg></button></div>
      <div class="scroll">
        <ul class="chat-list" id="chat-list"></ul>
        <div class="global hidden" id="global-box"><div class="sub" data-i18n="global_search"></div><div id="global-results"></div></div>
        <div class="list-empty hidden" id="list-empty">
          <img src="/icons/mark.png" alt="">
          <p data-i18n="no_chats"></p>
          <span data-i18n="no_chats_hint"></span>
        </div>
      </div>
      <button class="fab" id="btn-new"><svg><use href="#i-pen"/></svg></button>
    </section>

    <!-- KONTAKTLAR -->
    <section class="pane hidden" id="pane-contacts">
      <header class="pane-head"><h2 data-i18n="tab_contacts"></h2></header>
      <div class="search-row"><div class="search"><svg><use href="#i-search"/></svg><input id="contact-search" data-i18n-ph="search_users"></div></div>
      <div class="scroll">
        <button class="row-btn" id="btn-invite"><span class="ri"><svg><use href="#i-share"/></svg></span><span data-i18n="invite"></span></button>
        <button class="row-btn hidden" id="btn-sync"><span class="ri c5"><svg><use href="#i-user"/></svg></span><span data-i18n="find_contacts"></span></button>
        <div id="contact-results"></div>
        <div id="contact-list"></div>
      </div>
    </section>

    <!-- SOZLAMALAR -->
    <section class="pane hidden" id="pane-settings">
      <header class="pane-head"><h2 data-i18n="tab_settings"></h2></header>
      <div class="scroll">
        <button class="me-card" id="set-me"></button>
        <div class="group">
          <button class="row-btn" data-set="lang"><span class="ri c1"><svg><use href="#i-globe"/></svg></span><span><span data-i18n="language"></span><small id="set-lang"></small></span></button>
          <button class="row-btn" data-set="theme"><span class="ri c2"><svg><use href="#i-moon"/></svg></span><span><span data-i18n="night"></span><small id="theme-label"></small></span></button>
          <button class="row-btn" data-set="notif"><span class="ri c3"><svg><use href="#i-bell"/></svg></span><span><span data-i18n="notifications"></span><small id="set-notif"></small></span></button>
          <button class="row-btn" data-set="email"><span class="ri c5"><svg><use href="#i-mail"/></svg></span><span><span>Email</span><small id="set-email"></small></span></button>
          <button class="row-btn" data-set="storage"><span class="ri c4"><svg><use href="#i-download"/></svg></span><span><span data-i18n="storage_title"></span><small id="set-storage"></small></span></button>
        </div>
        <div class="group">
          <button class="row-btn" data-set="saved"><span class="ri c4"><svg><use href="#i-bookmark"/></svg></span><span data-i18n="saved"></span></button>
          <button class="row-btn" data-install><span class="ri c5"><svg><use href="#i-download"/></svg></span><span data-i18n="install_app"></span></button>
          <button class="row-btn" data-set="invite"><span class="ri c6"><svg><use href="#i-share"/></svg></span><span data-i18n="invite"></span></button>
        </div>
        <div class="group">
          <button class="row-btn danger" data-set="logout"><span class="ri c7"><svg><use href="#i-logout"/></svg></span><span data-i18n="logout"></span></button>
        </div>
        <p class="version"><img src="/icons/mark.png" alt=""> Birga v4.0</p>
      </div>
    </section>

    <!-- PROFIL (o'zim) -->
    <section class="pane hidden" id="pane-profile"><div class="scroll" id="my-profile"></div></section>

    <nav class="bottom-nav" id="bottom-nav">
      <button data-tab="chats" class="on"><span class="nb"><svg><use href="#i-chats"/></svg><b class="badge hidden" id="nav-badge"></b></span><span data-i18n="tab_chats"></span></button>
      <button data-tab="contacts"><span class="nb"><svg><use href="#i-user"/></svg></span><span data-i18n="tab_contacts"></span></button>
      <button data-tab="settings"><span class="nb"><svg><use href="#i-gear"/></svg></span><span data-i18n="tab_settings"></span></button>
      <button data-tab="profile"><span class="nb" id="nav-me"></span><span data-i18n="tab_profile"></span></button>
    </nav>
  </aside>

  <main class="chat" id="chat">
    <div class="chat-empty" id="chat-empty">
      <img src="/icons/mark.png" alt="">
      <p data-i18n="choose_chat"></p>
    </div>

    <header class="chat-head hidden" id="chat-head">
      <button class="icon-btn" id="btn-back"><svg><use href="#i-back"/></svg></button>
      <div class="peer" id="peer-info"></div>
      <button class="icon-btn" id="btn-audio-call"><svg><use href="#i-phone"/></svg></button>
      <button class="icon-btn" id="btn-video-call"><svg><use href="#i-video"/></svg></button>
    </header>

    <div class="messages hidden" id="messages"></div>

    <div class="reply-bar hidden" id="reply-bar">
      <svg id="reply-icon"><use href="#i-reply"/></svg>
      <div><b id="reply-name"></b><span id="reply-text"></span></div>
      <button class="icon-btn" id="reply-cancel"><svg><use href="#i-close"/></svg></button>
    </div>

    <div class="emoji-panel hidden" id="emoji-panel">
      <div class="ep-tabs" id="ep-tabs"></div>
      <div class="ep-cats" id="ep-cats"></div>
      <input class="ep-search" id="ep-search" autocapitalize="off">
      <div class="ep-body" id="ep-body"></div>
    </div>
    <footer class="composer hidden" id="composer">
      <div class="composer-row" id="composer-row">
        <button class="icon-btn" id="btn-attach"><svg><use href="#i-clip"/></svg></button>
        <input type="file" id="file-input" multiple hidden>
        <textarea id="text" rows="1" data-i18n-ph="write_msg"></textarea>
        <button class="icon-btn" id="btn-emoji"><svg><use href="#i-smile"/></svg></button>
        <button class="icon-btn rec-alt" id="btn-round" data-i18n-title="rec_round_title"><svg><use href="#i-round"/></svg></button>
      </div>
      <div class="rec-row hidden" id="rec-row">
        <span class="rec-dot"></span><span id="rec-time">0:00</span><div class="rec-wave" id="rec-wave"></div>
        <div class="rec-hint" id="rec-hint" data-i18n="slide_cancel"></div>
        <button class="link-btn danger hidden" id="rec-cancel" data-i18n="cancel"></button>
      </div>
      <div class="rec-lock hidden" id="rec-lock"><svg><use href="#i-lock"/></svg><span>⌃</span></div>
      <button class="send-btn" id="btn-action" aria-label="send" data-i18n-title="rec_voice_title">
        <svg class="ic-send"><use href="#i-send"/></svg>
        <svg class="ic-mic"><use href="#i-mic"/></svg>
        <svg class="ic-round"><use href="#i-round"/></svg>
      </button>
    </footer>
    <div class="channel-bar hidden" id="channel-bar"></div>
  </main>
</div>

<!-- Profil sahifasi (boshqa foydalanuvchi) -->
<div class="profile-page hidden" id="profile-page"><div class="pp-inner" id="profile-inner"></div></div>

<!-- Hikoya ko'ruvchi -->
<div class="story-viewer hidden" id="story-viewer">
  <div class="sv-stage" id="sv-stage">
    <div class="sv-bars" id="sv-bars"></div>
    <div class="sv-head"><div id="sv-user"></div><button class="icon-btn light" id="sv-close"><svg><use href="#i-close"/></svg></button></div>
    <div class="sv-media" id="sv-media"></div>
    <div class="sv-caption" id="sv-caption"></div>
    <div class="sv-foot" id="sv-foot"></div>
  </div>
</div>

<!-- Yumaloq video yozish -->
<div class="round-rec hidden" id="round-rec">
  <div class="round-wrap">
    <svg class="round-ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" class="track"/><circle cx="50" cy="50" r="48" class="prog" id="round-prog"/></svg>
    <video id="round-preview" autoplay muted playsinline></video>
  </div>
  <div class="round-time" id="round-time">0:00</div>
  <div class="round-actions">
    <button class="icon-btn light" id="round-flip"><svg><use href="#i-flip"/></svg></button>
    <span id="round-actions" class="round-actions hidden">
      <button class="icon-btn light" id="round-cancel"><svg><use href="#i-trash"/></svg></button>
      <button class="send-btn" id="round-send" data-mode="send"><svg class="ic-send"><use href="#i-send"/></svg></button>
    </span>
  </div>
</div>

<!-- Qo'ng'iroq oynasi -->
<div class="call hidden" id="call">
  <video id="remote-video" autoplay playsinline></video>
  <audio id="remote-audio" autoplay></audio>
  <video id="local-video" autoplay muted playsinline></video>
  <div class="call-info" id="call-info">
    <div class="call-avatar" id="call-avatar"></div>
    <h2 id="call-name"></h2>
    <p id="call-status"></p>
  </div>
  <div class="call-controls" id="call-controls">
    <button class="cbtn" id="c-mute"><svg><use href="#i-mic"/></svg><span data-i18n="mic"></span></button>
    <button class="cbtn" id="c-cam"><svg><use href="#i-video"/></svg><span data-i18n="camera"></span></button>
    <button class="cbtn" id="c-flip"><svg><use href="#i-flip"/></svg><span data-i18n="flip"></span></button>
    <button class="cbtn end" id="c-end"><svg><use href="#i-phone"/></svg><span data-i18n="end"></span></button>
  </div>
  <div class="call-controls hidden" id="call-incoming">
    <button class="cbtn end" id="c-reject"><svg><use href="#i-phone"/></svg><span data-i18n="decline"></span></button>
    <button class="cbtn accept" id="c-accept"><svg><use href="#i-phone"/></svg><span data-i18n="answer"></span></button>
  </div>
</div>

<div class="viewer hidden" id="viewer"><button class="icon-btn light" id="viewer-close"><svg><use href="#i-close"/></svg></button><div id="viewer-body"></div></div>
<div class="modal hidden" id="modal"><div class="modal-card" id="modal-card"></div></div>
<div class="ctx hidden" id="ctx"></div>
<div class="toast hidden" id="toast"></div>

<script src="/vendor/phone.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/app.js"></script>
</body>
</html>
